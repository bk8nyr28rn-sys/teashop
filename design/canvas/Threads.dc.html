<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>红线</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC24B}a:hover{color:#FFD67F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1E2048; color: #FFFFFF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px">

  <header style="padding: 18px 16px 10px; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 0.08em">红线</h1>
      <span style="font-size: 12px; color: #B9BCE8">你的 OC：开放 · 牵着 2 根线</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; background: #2A2D5E; border-radius: 999px; padding: 4px 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L19 9 L12 21 L5 9 Z" fill="#7FE0FF"></path></svg>
      <span style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 16px">186</span>
    </div>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">

    <article style="background: #2A2D5E; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid #F0525A">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 60px; height: 60px; flex: none; border-radius: 18px; background: #353A75; overflow: hidden; position: relative">
          <div style="position: absolute; left: 0; top: 2px; width: 60px">
            <dc-import name="Chibi" robe="#52D6A6" trim="#FFC24B" headdress="bun" mood="happy" hint-size="60px,75px"></dc-import>
          </div>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
            <span style="font-weight: 700; font-size: 17px">阿青</span>
            <span style="font-size: 11px; background: #FFC24B; color: #1E2048; font-weight: 700; border-radius: 6px; padding: 1px 6px">知己</span>
            <span style="font-size: 11px; color: #B9BCE8">好友 · 专一</span>
          </div>
          <span style="font-size: 12px; color: #FF9A6B">捎来一句话，等你回音</span>
        </div>
        <span style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 24px">52<span style="font-size: 12px; color: #B9BCE8"> /200</span></span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="position: relative; height: 10px; border-radius: 999px; background: #1E2048; overflow: hidden">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 26%; background: #F0525A; border-radius: 999px"></div>
          <div style="position: absolute; left: 15%; top: 0; bottom: 0; width: 2px; background: #4A4F8F"></div>
          <div style="position: absolute; left: 30%; top: 0; bottom: 0; width: 2px; background: #4A4F8F"></div>
          <div style="position: absolute; left: 60%; top: 0; bottom: 0; width: 2px; background: #4A4F8F"></div>
        </div>
        <div style="position: relative; height: 16px; font-size: 10.5px; color: #B9BCE8">
          <span style="position: absolute; left: 0">相识</span>
          <span style="position: absolute; left: 15%; transform: translateX(-50%); color: #FFC24B">知己</span>
          <span style="position: absolute; left: 30%; transform: translateX(-50%)">倾心</span>
          <span style="position: absolute; left: 60%; transform: translateX(-50%)">挚爱</span>
          <span style="position: absolute; right: 0">金缕</span>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="min-height: 44px; border: 0; border-radius: 12px; background: #F0525A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">回话</button>
        <button type="button" style="min-height: 44px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2">回句玩笑<span style="font-size: 10px; color: #B9BCE8">翻倍 · 可能说岔</span></button>
        <a href="BigInteract.dc.html" style="min-height: 44px; border-radius: 12px; background: #FFC24B; color: #1E2048; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2">结伴历练<span style="font-size: 10px; font-weight: 400">押灵石搏一把</span></a>
      </div>
    </article>

    <article style="background: #2A2D5E; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 60px; height: 60px; flex: none; border-radius: 18px; background: #4A2E45; overflow: hidden; position: relative">
          <div style="position: absolute; left: 0; top: 2px; width: 60px">
            <dc-import name="Chibi" robe="#7FA8FF" trim="#FFC24B" headdress="crown" mood="angry" hint-size="60px,75px"></dc-import>
          </div>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
            <span style="font-weight: 700; font-size: 17px; color: #FF9A6B">云游客</span>
            <span style="font-size: 11px; border: 1px solid #B9BCE8; color: #B9BCE8; border-radius: 6px; padding: 0 6px">相识</span>
            <span style="font-size: 11px; color: #B9BCE8">NPC 散修</span>
          </div>
          <span style="font-size: 12px; color: #FF9A6B">一句玩笑说岔了，翻了脸（变脸中）</span>
        </div>
        <span style="font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 24px">14<span style="font-size: 12px; color: #B9BCE8"> /200</span></span>
      </div>
      <div style="position: relative; height: 10px; border-radius: 999px; background: #1E2048; overflow: hidden">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 7%; background: #F0525A; border-radius: 999px"></div>
        <div style="position: absolute; left: 7%; top: 0; bottom: 0; width: 2%; background: #FF9A6B; opacity: 0.55"></div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <button type="button" style="flex: 1; min-height: 44px; border: 0; border-radius: 12px; background: #52D6A6; color: #1E2048; font-family: inherit; font-size: 14px; font-weight: 700">和好</button>
        <span style="flex: 1.4; font-size: 11.5px; color: #B9BCE8; line-height: 1.5">双方各上线 3 次内都和好，散开的会聚回；破镜重圆还能把一部分怨丝转回红线。</span>
      </div>
    </article>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="min-height: 64px; border: 2px dashed #4A4F8F; border-radius: 16px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">＋ 和散修牵线<span style="font-size: 11px; color: #B9BCE8">随时可牵</span></button>
      <button type="button" style="min-height: 64px; border: 2px dashed #4A4F8F; border-radius: 16px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">＋ 邀请好友<span style="font-size: 11px; color: #B9BCE8">真人线可结嫡传</span></button>
    </div>

    <p style="margin: 0; font-size: 11.5px; color: #B9BCE8; line-height: 1.6">多牵一根线，旧线会心力分散；和一根线互动时，其他线会按亲密程度吃醋。</p>
  </div>

  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #15173A; border-top: 1px solid #353A75; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 4 L21 11 M6 10 V20 H18 V10 M10 20 V14 H14 V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>宅院</span>
    </a>
    <a href="Threads.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #F0525A; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 C8 6 16 18 20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="4" cy="18" r="2" fill="currentColor"></circle><circle cx="20" cy="6" r="2" fill="currentColor"></circle></svg>
      <span>红线</span>
    </a>
    <a href="Family.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="6" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="18" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 10 V13 M7.5 14 L10 12 M16.5 14 L14 12" stroke="currentColor" stroke-width="2"></path></svg>
      <span>家族</span>
    </a>
    <a href="Tribulation.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 L6 13 H11 L10 21 L18 10 H13 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>渡劫</span>
    </a>
  </nav>
</div>
</x-dc>

</body>
</html>
