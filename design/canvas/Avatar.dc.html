<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>捏形象</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC24B}a:hover{color:#FFD67F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2A2D5E; color: #FFFFFF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px; display: flex; flex-direction: column">

  <header style="padding: 18px 16px 8px">
    <h1 style="margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 26px">先捏一个你的 OC</h1>
  </header>

  <div style="flex: 1; min-height: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: center; border-radius: 20px; background: #15173A; padding: 10px">
      <div style="width: 132px">
        <dc-import name="Chibi" robe="#52D6A6" trim="#FFC24B" headdress="guan" mood="happy" skin="#FFE4D6" hair="#2B2233" hint-size="132px,165px"></dc-import>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="oc-name" style="font-size: 13px; color: #B9BCE8">名字</label>
      <input id="oc-name" value="阿满" maxlength="8" style="min-height: 46px; box-sizing: border-box; background: #15173A; border: 2px solid #4A4F8F; border-radius: 12px; padding: 8px 12px; color: #FFFFFF; font-family: inherit; font-size: 16px">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; color: #B9BCE8; padding: 0; margin-bottom: 6px">性别（随时可改，和发型、行当都不挂钩）</legend>
      <div style="display: flex; gap: 8px">
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">女</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">男</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">其他</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border: 2px solid #FFC24B; border-radius: 12px; background: #FFC24B; color: #1E2048; font-family: inherit; font-size: 14px; font-weight: 700">不说</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; color: #B9BCE8; padding: 0; margin-bottom: 6px">发型</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">发髻</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border: 2px solid #FFC24B; border-radius: 12px; background: #FFC24B; color: #1E2048; font-family: inherit; font-size: 14px; font-weight: 700">玉冠</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">披发</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">翎子 · 戏曲款</button>
        <button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">凤冠 · 戏曲款</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; color: #B9BCE8; padding: 0; margin-bottom: 6px">衣色</legend>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-label="衣色 朱红" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #F0525A; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 翠青" aria-pressed="true" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #52D6A6; box-shadow: 0 0 0 3px #FFC24B"></button>
        <button type="button" aria-label="衣色 天蓝" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #7FA8FF; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 藤紫" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #9B8CFF; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 明黄" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #FFC24B; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 橘橙" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #FF9A6B; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 桃粉" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #FF8FC7; box-shadow: 0 0 0 2px #4A4F8F"></button>
        <button type="button" aria-label="衣色 月白" style="width: 36px; height: 36px; border-radius: 999px; border: 3px solid #2A2D5E; background: #E9ECFF; box-shadow: 0 0 0 2px #4A4F8F"></button>
      </div>
    </fieldset>

    <p style="margin: 0; font-size: 12px; color: #B9BCE8; line-height: 1.6">往下还有：镶边、肤色、发色、行当（性格标签）。族人的样子取自父母双方：衣色随搭档，镶边随你。</p>
  </div>

  <footer style="padding: 10px 16px 18px">
    <button type="button" style="width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: #D63C48; color: #FFFFFF; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 22px; letter-spacing: 0.12em">开始</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
