<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>家族与嫡传</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&amp;family=Noto+Sans+SC:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC24B}a:hover{color:#FFD67F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #1E2048; color: #FFFFFF; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 14px">

  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 2px">
    <h1 style="margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 30px; letter-spacing: 0.08em">家族</h1>
    <span style="font-size: 12px; color: #B9BCE8">族人 5 位 · 1 位疗伤中 · 族人由红线结成，修为越高大阵越厚</span>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">

    <section aria-labelledby="heir-title" style="background: #2A2D5E; border: 2px solid #FFC24B; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="width: 78px; flex: none">
          <dc-import name="Chibi" robe="#FFC24B" trim="#F0525A" headdress="crown" mood="happy" hint-size="78px,98px"></dc-import>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <h2 id="heir-title" style="margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 22px; color: #FFC24B">嫡传 · 小满</h2>
          <span style="font-size: 12px; color: #B9BCE8">你与阿青的情丝所结</span>
          <span style="font-size: 12px">灵根 <b>82</b> · 出生时锁定</span>
          <span style="font-size: 12px">特质：文武生、正印花旦</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px">两人商量，记在哪家族谱？</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 44px; border: 0; border-radius: 12px; background: #F0525A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700">记在你家</button>
          <button type="button" style="min-height: 44px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">记在阿青家</button>
        </div>
        <span style="font-size: 11.5px; color: #B9BCE8; line-height: 1.6">另一家照样能探望。孩子成年时会再表一次态，看这些年谁陪得多。</span>
      </div>
    </section>

    <section aria-labelledby="clan-title" style="background: #2A2D5E; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <h2 id="clan-title" style="margin: 0; font-size: 15px">族人</h2>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #FFC24B">你与阿青所结 · 3 位</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
            <div style="width: 56px"><dc-import name="Chibi" robe="#7FA8FF" trim="#FFC24B" headdress="plain" mood="happy" hint-size="56px,70px"></dc-import></div>
            <span style="font-size: 11px; color: #B9BCE8">修为 7.5</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
            <div style="width: 56px"><dc-import name="Chibi" robe="#52D6A6" trim="#FFC24B" headdress="bun" mood="calm" hint-size="56px,70px"></dc-import></div>
            <span style="font-size: 11px; color: #B9BCE8">修为 5</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative">
            <div style="width: 56px; opacity: 0.6"><dc-import name="Chibi" robe="#7FA8FF" trim="#FFC24B" headdress="plain" mood="sad" hint-size="56px,70px"></dc-import></div>
            <span style="position: absolute; top: 0; right: 0; background: #FF9A6B; color: #1E2048; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 0 5px">疗伤</span>
            <span style="font-size: 11px; color: #FF9A6B">还剩 1 天</span>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #FFC24B">你与云游客所结 · 1 位</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
            <div style="width: 56px"><dc-import name="Chibi" robe="#9B8CFF" trim="#FFC24B" headdress="plain" mood="calm" hint-size="56px,70px"></dc-import></div>
            <span style="font-size: 11px; color: #B9BCE8">修为 2</span>
          </div>
        </div>
      </div>

      <button type="button" style="min-height: 44px; border: 2px solid #4A4F8F; border-radius: 12px; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 14px">炼疗伤丹（2 诡心）· 让族人立刻痊愈</button>
    </section>
  </div>

  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #15173A; border-top: 1px solid #353A75; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 4 L21 11 M6 10 V20 H18 V10 M10 20 V14 H14 V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>宅院</span>
    </a>
    <a href="Threads.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 C8 6 16 18 20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="4" cy="18" r="2" fill="currentColor"></circle><circle cx="20" cy="6" r="2" fill="currentColor"></circle></svg>
      <span>红线</span>
    </a>
    <a href="Family.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #F0525A; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="6" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="18" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 10 V13 M7.5 14 L10 12 M16.5 14 L14 12" stroke="currentColor" stroke-width="2"></path></svg>
      <span>家族</span>
    </a>
    <a href="Tribulation.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9BCE8; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 L6 13 H11 L10 21 L18 10 H13 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
      <span>渡劫</span>
    </a>
  </nav>
</div>
</x-dc>

</body>
</html>
