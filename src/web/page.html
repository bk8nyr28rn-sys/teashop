<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>红线守宅原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--__FONT_LICENSES__-->
<style>
/*__FONTS__*/
/* 布局：竖屏一栏。顶栏（资源）＋ 可滚动的中间（场景在上、卡片在下）＋ 底部四个导航。单一夜色主题。 */
:root {
  --bg: #1E2048;      /* 夜色，页面底 */
  --panel: #2A2D5E;   /* 卡片 */
  --deep: #15173A;    /* 更深一层：导航、内嵌卡片 */
  --line: #4A4F8F;
  --line-2: #353A75;
  --text: #FFFFFF;
  --muted: #B9BCE8;
  --ink: #1E2048;     /* 亮色底上的字 */
  --red: #F0525A;     /* 红线 */
  --red-btn: #D63C48; /* 红色按钮底（白字够对比） */
  --gold: #FFC24B;    /* 奖励、等级 */
  --jade: #52D6A6;    /* 好事、安全 */
  --ember: #FF9A6B;   /* 坏事、怨丝 */
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--deep); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ic { width: 22px; height: 22px; flex: none; }

#app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

/* 顶栏 */
#hud { flex: none; padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.me-btn { width: 44px; height: 44px; flex: none; padding: 0; border: 2px solid var(--gold); border-radius: 14px; background: var(--line-2); overflow: hidden; }
.portrait { display: block; width: 100%; height: 100%; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.who b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-btn { flex: none; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.chip-btn .ic { width: 14px; height: 14px; }
.icon-btn { flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--panel); display: grid; place-items: center; }
.res-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.res { min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 12px; padding: 4px 8px 5px; line-height: 1.2; }
.res .ic { width: 14px; height: 14px; }
.res span { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.res b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.res.warn b { color: var(--ember); }
.res.bump { animation: bump 0.5s; }
@keyframes bump { 30% { transform: scale(1.16); background: var(--line); } }

/* 中间：场景 + 卡片 */
#main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
#stage { position: relative; flex: none; }
.scene-svg { display: block; width: 100%; height: auto; }
.scene-svg text { font-family: var(--font-body); }
.scene-svg .display { font-family: var(--font-display); }
#fx { position: absolute; inset: 0; pointer-events: none; }
.tap { cursor: pointer; }

.bob { animation: bob 2.6s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes bob { 50% { transform: translateY(-3px); } }
.float { animation: float 3.2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes float { 50% { transform: translateY(-7px); } }
.ward { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; animation-delay: var(--sync, 0s); }
@keyframes spin { to { transform: rotate(360deg); } }
.glow, .twinkle { animation: glow 2.6s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes glow { 50% { opacity: 0.65; } }
.drift { animation: drift 40s ease-in-out infinite alternate; animation-delay: var(--sync, 0s); }
@keyframes drift { to { transform: translateX(26px); } }
.red-thread { animation: pulse 2.2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes pulse { 50% { stroke-width: 4.5; } }
.flash { animation: bolt 2.8s linear infinite; animation-delay: var(--sync, 0s); }
@keyframes bolt { 0%, 84%, 100% { opacity: 0.25; } 88%, 94% { opacity: 1; } 91% { opacity: 0.4; } }

/* 一次性的砸门特效 */
.fx-in { animation: approach 0.9s ease-out both; }
@keyframes approach { from { transform: translateX(90px); opacity: 0; } }
.fx-out { transform-box: fill-box; transform-origin: center; }
.fx-defended, .fx-guarded { animation: poof 0.5s 1.2s ease-in both; }
@keyframes poof { to { transform: scale(1.6); opacity: 0; } }
.fx-breach { animation: lunge 0.9s 1.1s both; }
@keyframes lunge { 50% { transform: translateX(-84px) scale(1.15); } 100% { transform: translateX(-70px); opacity: 0; } }
.fx-purified { animation: soothe 1s 1.2s both; }
@keyframes soothe { to { transform: translate(-50px, -40px) scale(0.45); opacity: 0.85; } }
.fx-knock { animation: knock 1.1s both; }
@keyframes knock { 0% { opacity: 0; transform: translateY(6px); } 15%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.fx-badge { transform-box: fill-box; transform-origin: center; animation: badge 2.6s 1.15s both; }
@keyframes badge { 0% { opacity: 0; transform: scale(0.3); } 12% { opacity: 1; transform: scale(1.3); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.fx-burst { opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 0.9s 1.1s both; }
@keyframes burst { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 0.95; transform: scale(1.1) rotate(18deg); } 100% { opacity: 0; transform: scale(1.5) rotate(40deg); } }
.fx-flash { opacity: 0; animation: screenflash 0.7s 1.5s both; }
@keyframes screenflash { 0%, 100% { opacity: 0; } 25% { opacity: 0.55; } }
.fx-now { animation-delay: 0s; }

/* 宅院页 */
.subtitle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; text-align: left; background: var(--deep); border: 1px solid var(--line-2); border-radius: 14px; padding: 8px 12px; }
.subtitle .tag { flex: none; font-family: var(--font-display); font-size: 13px; background: var(--gold); color: var(--ink); border-radius: 6px; padding: 1px 7px; }
.subtitle.tone-good .tag { background: var(--jade); }
.subtitle.tone-bad .tag { background: var(--ember); }
.subtitle.tone-drama .tag { background: var(--red-btn); color: var(--text); }
.subtitle .line { flex: 1; min-width: 0; font-size: 13.5px; }
.subtitle .go { flex: none; color: var(--muted); font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 10px; border: 1px solid currentColor; border-radius: 999px; }
.chip-jade { color: var(--jade); } .chip-gold { color: var(--gold); } .chip-ember { color: var(--ember); } .chip-red { color: #FF8A90; }
.todo { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; text-align: left; border: 0; border-radius: 14px; padding: 10px 14px; font-size: 14px; }
.todo span { flex: 1; min-width: 0; }
.todo b { flex: none; font-size: 13px; }
.todo-red { background: var(--red-btn); color: var(--text); }
.todo-gold { background: var(--gold); color: var(--ink); }
.todo-ember { background: var(--ember); color: var(--ink); }
.todo.snatch { flex-direction: column; align-items: stretch; }
.todo.snatch .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.todo.snatch .btn { border-color: var(--text); }
.todo.snatch .btn.primary { background: var(--text); color: var(--red-btn); }
.actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.action { position: relative; min-height: 68px; border: 0; border-radius: 16px; background: var(--panel); padding: 10px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.action b { font-size: 14px; }
.action small { font-size: 11px; color: var(--muted); }
.action .badge { position: absolute; top: -6px; right: 4px; background: var(--jade); color: var(--ink); font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 6px; }
.action:disabled { opacity: 0.45; }
.action:active:not(:disabled), .btn:active:not(:disabled), .option:active:not(:disabled) { transform: scale(0.96); }

/* 通用：卡片、按钮 */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; padding-top: 4px; }
.page-head h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: 0.06em; }
.page-head p { font-size: 12px; color: var(--muted); }
.card { min-width: 0; background: var(--panel); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.deep { background: var(--deep); }
.card h2 { font-size: 15px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
.empty { font-size: 13px; color: var(--muted); }
.btn { min-height: 44px; min-width: 0; border: 2px solid var(--line); border-radius: 12px; background: transparent; padding: 4px 10px; font-size: 14px; line-height: 1.25; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.btn small { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.btn.primary { background: var(--red-btn); border-color: var(--red-btn); font-weight: 700; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 700; }
.btn.gold small { color: #4A3B12; }
.btn.jade { background: var(--jade); border-color: var(--jade); color: var(--ink); font-weight: 700; }
.btn.warn { border-color: var(--ember); color: var(--ember); }
.btn.wide { width: 100%; }
.btn.huge { width: 100%; min-height: 54px; border-radius: 16px; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0.12em; }
.btn:disabled { opacity: 0.45; }
.link { min-height: 44px; border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.dashed { min-height: 64px; border: 2px dashed var(--line); border-radius: 16px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px; }
.dashed small { font-size: 11px; color: var(--muted); }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.split .ok { color: var(--jade); }
.big-num { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.big-num.gold { color: var(--gold); } .big-num.jade { color: var(--jade); }
.bar { position: relative; height: 10px; border-radius: 999px; background: var(--deep); overflow: hidden; }
.card.deep .bar { background: var(--line-2); }
.bar b { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--red); transition: width 0.4s ease; }
.bar.golden b { background: linear-gradient(90deg, var(--red), var(--gold)); }
.bar.jade b { background: var(--jade); }
.bar i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
.bar-labels { position: relative; height: 16px; font-size: 10.5px; color: var(--muted); }
.bar-labels span { position: absolute; top: 0; white-space: nowrap; }
.bar-labels .on { color: var(--gold); font-weight: 700; }
.option { min-height: 68px; min-width: 0; border: 2px solid var(--line); border-radius: 16px; background: var(--panel); padding: 8px 12px; text-align: left; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; }
.option b { font-size: 14px; }
.option small { font-size: 11.5px; color: var(--muted); }
.option.on { border-color: var(--gold); } .option.on small { color: var(--gold); }
.option.on.jade { border-color: var(--jade); } .option.on.jade small { color: var(--jade); }
.option:disabled { opacity: 0.45; }
.sheet .option { background: var(--deep); width: 100%; }

/* 红线页 */
.thread.is-waiting { box-shadow: 0 0 0 2px var(--red); }
.thread.is-quarrel { box-shadow: 0 0 0 2px var(--ember); }
.thread.is-cut { opacity: 0.9; }
.thread-top { display: flex; align-items: center; gap: 12px; }
.avatar { width: 56px; height: 56px; flex: none; border-radius: 18px; background: var(--line-2); overflow: hidden; }
.avatar-svg { display: block; width: 100%; height: 100%; }
.thread-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.name-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.name-row b { font-size: 16px; }
.tier { font-size: 11px; font-weight: 700; background: var(--gold); color: var(--ink); border-radius: 6px; padding: 1px 6px; }
.kind { font-size: 11px; color: var(--muted); }
.online { font-size: 11px; color: var(--jade); }
.online::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 3px; border-radius: 999px; background: var(--jade); }
.state { font-size: 12px; color: var(--ember); }
.strands { flex: none; font-family: var(--font-display); font-size: 22px; }
.strands small { font-family: var(--font-body); font-size: 11px; color: var(--muted); }
.more-row { display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 8px 16px; }

/* 家族页 */
.group { display: flex; flex-direction: column; gap: 6px; }
.group-title { font-size: 12px; color: var(--gold); }
.members { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.member { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.member-svg { width: 56px; height: 70px; }
.member.hurt .member-svg { opacity: 0.6; }
.member.hurt span { color: var(--ember); }
.heir { box-shadow: 0 0 0 2px var(--gold); }
.heir-top { display: flex; align-items: center; gap: 12px; }
.heir-svg { width: 78px; height: 98px; flex: none; }
.heir-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.heir-info h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; color: var(--gold); }

/* 底部导航 */
#nav { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--deep); border-top: 1px solid var(--line-2); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-item { position: relative; min-height: 60px; border: 0; background: none; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.nav-item .ic { width: 24px; height: 24px; }
.nav-item.on { color: #FF8A90; }
.nav-item .dot { position: absolute; top: 9px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 999px; background: var(--gold); }

/* 爽点弹字 */
#banner { position: absolute; left: 0; right: 0; top: 122px; z-index: 6; display: flex; justify-content: center; pointer-events: none; }
.pop { max-width: 88%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 12px 22px; border: 2px solid var(--gold); border-radius: 20px; background: rgba(21, 23, 58, 0.94); animation: pop 1.7s both; }
.pop b { font-family: var(--font-display); font-weight: 400; font-size: 34px; letter-spacing: 0.05em; color: var(--gold); }
.pop span { font-size: 13.5px; }
.pop.tone-bad { border-color: var(--ember); } .pop.tone-bad b { color: var(--ember); }
.pop.tone-drama { border-color: var(--red); } .pop.tone-drama b { color: #FF8A90; }
@keyframes pop { 0% { opacity: 0; transform: scale(0.5); } 10% { opacity: 1; transform: scale(1.12); } 18%, 82% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-10px) scale(0.96); } }

#toast { position: absolute; left: 0; right: 0; bottom: 74px; z-index: 12; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.toast-msg { background: var(--text); color: var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; text-align: center; }
.toast-msg.tone-bad { background: var(--ember); }

/* 弹层 */
.backdrop { position: absolute; inset: 0; z-index: 8; background: rgba(8, 9, 30, 0.62); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; max-height: 92%; display: flex; flex-direction: column; background: var(--panel); border-radius: 24px 24px 0 0; }
.sheet-head { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 14px 6px; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.sheet-head .icon-btn { background: var(--deep); }
.sheet-body { min-height: 0; overflow-y: auto; padding-block: 6px 16px; }
.sheet-foot { flex: none; padding-block: 8px 14px; }
fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
legend { padding: 0; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
label { font-size: 13px; color: var(--muted); }
input { width: 100%; min-height: 48px; box-sizing: border-box; background: var(--deep); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; color: var(--text); font: inherit; font-size: 16px; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { min-height: 44px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: transparent; font-size: 14px; }
.opt.on { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 700; }
.opt:disabled { opacity: 0.4; }
.stakes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stakes .opt { min-height: 52px; padding: 0; font-family: var(--font-display); font-size: 20px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { width: 44px; height: 44px; border: 3px solid var(--panel); border-radius: 999px; background: var(--c); box-shadow: 0 0 0 2px var(--line); }
.swatch.on { box-shadow: 0 0 0 3px var(--gold); }
.avatar-stage, .duo { position: relative; display: flex; justify-content: center; gap: 4px; padding: 12px; border-radius: 20px; background: radial-gradient(circle at 50% 65%, #3D4285, var(--deep)); }
.avatar-big { width: 150px; height: 188px; }
.duo-svg { width: 84px; height: 105px; }
.duo.win .duo-svg { animation: hop 0.45s ease-out 2; }
@keyframes hop { 50% { transform: translateY(-12px); } }
.result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 20px; background: rgba(21, 23, 58, 0.7); }
.result b { font-family: var(--font-display); font-weight: 400; font-size: 30px; }
.result.ok b { color: var(--gold); } .result.bad b { color: var(--ember); }
.outcome { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 12px; background: var(--panel); font-size: 13px; }
.outcome span { font-size: 12px; }
.outcome.ok span { color: var(--jade); } .outcome.bad span { color: var(--ember); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.log li { font-size: 13.5px; line-height: 1.55; }
.log time { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log .tone-good time { color: var(--jade); } .log .tone-bad time { color: var(--ember); } .log .tone-drama time { color: #FF8A90; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<div id="app">
  <header id="hud"></header>
  <main id="main">
    <div id="stage"><div id="scene"></div><div id="fx"></div></div>
    <div id="panel"></div>
  </main>
  <nav id="nav" aria-label="主导航"></nav>
  <div id="banner" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <div id="sheet"></div>
</div>
<script>/*__BUNDLE__*/</script>
