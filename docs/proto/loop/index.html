}
:root[data-theme="dark"] { --bg: #11181B; --panel: #19232A; --ink: #E3EBE7; --muted: #94A6A1; --line: #2C3B40; --accent: #55B99F; --seal: #E0654F; --on-seal: #1A1010; --gold: #E0B456; color-scheme: dark; }

}
function hex2hsl(hex) {

function headGeom(s) { const h = 372 / (3 + s.heads); return { cx: 120, hcy: 20 + h / 2, ry: h / 2 }; }
const INK = '#2B2233';
const lerp = (a, b, t) => a + (b - a) * t;

function bodyGeom(s) {
  const { cx, hcy, ry } = headGeom(s);
  const rx = ry * (0.9 + 0.2 * s.faceWidth);
  const shoulderY = hcy + ry + 2;
  const bodyLen = 392 - shoulderY;
  const torso = bodyLen * (0.5 - 0.1 * s.height);
  const waistY = shoulderY + torso * 0.72, hipY = shoulderY + torso;
  const sw = rx * 0.6 + s.build * 14, hw = sw * 0.92 + s.build * 4;
  const legW = 15 + s.build * 6, legGap = 5;
  return { cx, hcy, ry, rx, shoulderY, waistY, hipY, sw, hw, legW, legGap };
}

function layerBox(s, key, geometry = bodyGeom(s)) {
  const { cx, hcy, ry, rx, shoulderY, waistY, hipY, sw, hw } = geometry;
  const centered = (halfWidth, y, bottom) => ({ x: cx - halfWidth, y, w: halfWidth * 2, h: bottom - y });
  switch (key) {
    case 'hairFront': return centered(rx * 1.38, 0, hcy + ry * 1.3);
    case 'hairBack': return centered(rx * 1.65, 0, hcy + ry * 4);
    case 'head': return centered(rx * 1.75, 0, hcy + ry * 1.4);
    case 'top': return centered(Math.max(sw, hw) + 25, shoulderY - 8, 392);
    case 'back': return centered(108, Math.max(0, shoulderY - 85), 392);
    case 'sleeve': return { x: cx - sw - 36, y: shoulderY - 4, w: 52, h: hipY - shoulderY + 25 };
    case 'bottom': return centered(hw + 28, waistY - 8, 392);
    case 'shoes': return centered(hw + 12, 348, 398);
    case 'emblem': {
      const e = sw * 0.95;
      return centered(e / 2, lerp(shoulderY, waistY, 0.22), lerp(shoulderY, waistY, 0.22) + e);
    }
    case 'cloth': {
      const tile = 16 + 48 * s.tileSize;
      return centered(tile / 2, shoulderY, shoulderY + tile);
    }
    default: return { x: cx - 1.45 * ry, y: hcy - 1.5 * ry, w: 2.9 * ry, h: 2.9 * ry };
  }
}

function drawPerson(s0, expr, age, opt = {}) {

    s += `<rect x="12" y="156" width="102" height="64" rx="3" fill="#8A6A4C"/><rect x="16" y="160" width="94" height="26" fill="#6B4A3A"/><rect x="16" y="190" width="94" height="26" fill="#6B4A3A"/>`;
    G.treasures.slice(0, 8).forEach((t, i) => { const cx = 28 + (i % 4) * 23, cy = 176 + Math.floor(i / 4) * 30; s += `<circle cx="${cx}" cy="${cy}" r="7" fill="${TREASURE_COLOR[t.n] || '#E3B341'}" stroke="#FFF3C4" stroke-width="1.5"/>`; });
    s += `<text x="63" y="234" text-anchor="middle" font-size="11" fill="#5B4A3A">宝物架</text>`;
  }
  // 灶台：在烧时冒火和烟，烧好了锅上冒白气
  if (stoveOpen()) {
    const st = stoveState();
    s += `<rect x="22" y="128" width="36" height="24" rx="3" fill="#8C5A44"/><rect x="31" y="137" width="18" height="11" rx="5" fill="${st === 'cooking' ? '#F2A65A' : '#3A2C26'}"/><ellipse cx="40" cy="127" rx="13" ry="4" fill="#4A4F5C"/>`;
    if (st === 'cooking') s += `<path d="M36 120 q-4 -8 2 -14 M44 120 q4 -8 -2 -14" stroke="#9AA3A8" stroke-width="2" fill="none" opacity="0.7"/>`;
    if (st === 'ready') s += `<circle cx="40" cy="115" r="6" fill="#FFF7E8" opacity="0.9"/><circle cx="48" cy="109" r="4" fill="#FFF7E8" opacity="0.8"/>`;
  }
  // 仓库
  const n = Math.min(10, storeCount());
  for (let i = 0; i < n; i++) s += `<rect x="${256 + (i % 5) * 17}" y="${206 - Math.floor(i / 5) * 15}" width="16" height="14" rx="5" fill="${i % 2 ? '#C9A066' : '#B48A55'}" stroke="#7A5A3A"/>`;
  s += `<text x="298" y="234" text-anchor="middle" font-size="11" fill="#5B4A3A">仓库</text>`;
  // 大阵
  if (G.door >= 4) s += `<ellipse cx="180" cy="200" rx="86" ry="18" fill="none" stroke="#7FD6C2" stroke-width="2.5" class="glow"/>`;
  // 人
  const expr = G.hp <= 1 ? 'sad' : f > 0.8 ? 'surprised' : f < 0.2 ? 'happy' : 'calm';
  s += person(ME, expr, ageOf(G.day), 220, 236, 0.24);
  if (G.spouse) s += person(G.spouse.look, 'happy', ageOf(G.day) === 'elder' ? 'elder' : 'adult', 258, 238, 0.23);
  G.kids.slice(0, 3).forEach((k, i) => { s += person(k.look, 'happy', k.kind === '徒' ? 'adult' : 'child', 150 - i * 30, 240, k.kind === '徒' ? 0.21 : 0.23); });
  if (G.own && !G.kids.length) s += person(G.parents[0].look, 'calm', 'adult', 150, 238, 0.22);
  s += River.yardStone(false);
  // 前墙和门
  s += `<rect x="0" y="252" width="360" height="48" fill="#CBBFA8"/><rect x="0" y="246" width="360" height="8" fill="#4A4F5C"/>${doorSvg(G.door, 180, 300, 62, 58)}`;
  if (G.door >= 2) s += lanternSvg(136, 252) + lanternSvg(224, 252);
  if (G.door >= 3) s += lionSvg(120, 298) + lionSvg(240, 298, true);
  if (G.held) s += `<rect x="146" y="222" width="68" height="16" rx="2" fill="#2B2233"/><text x="180" y="234" text-anchor="middle" font-size="10" fill="#E3B341">守住 ${G.held} 夜</text>`;
  [40, 320, 92, 268].slice(0, G.traps.crossbow).forEach((x) => { s += crossbowSvg(x, 246); });
  if (G.traps.lamp) { s += `<path d="M0 250 Q90 262 150 252 M210 252 Q270 262 360 250" stroke="#3A2C26" fill="none"/>`; for (const x of [40, 90, 270, 320]) s += lanternSvg(x, 262, 5); }
  for (let i = 0; i < G.traps.talisman; i++) s += talismanSvg(166 + i * 28, 272);
  if (f > 0.75) s += `<rect width="360" height="300" fill="#1B2340" opacity="${(((f - 0.75) / 0.25) * 0.38).toFixed(2)}"/>`;
  return s;
}
function trapSummary() { return Object.entries(TRAPS).filter(([k]) => G.traps[k]).map(([k, t]) => ` · ${t.name} ${G.traps[k]}`).join(''); }
function renderHome() {
  const left = CFG.dusk - G.time;
  $('scene').innerHTML = `<svg viewBox="0 0 360 300" class="stage" role="img" aria-label="${G.fam}的院子：${DOORS[G.door].name}，宝物 ${G.treasures.length} 件">${homeSvg()}</svg>`;
  if (G.phase === 'intro') {
    $('panel').innerHTML = '<div class="where"><b>家门口</b><span>第一天 · 清晨</span></div><div class="acts"><button type="button" class="big main" data-a="start">开始</button><button type="button" class="big" data-a="avatar">先捏个人</button></div>';
    bindActs({ start: firstMorning, avatar: () => openEditor(render) });
    return;
  }
  const toWharf = !Guidance.open(2) || River.firstVisit();
  const heals = G.hp < CFG.hpMax ? ['金疮药', '草药'].filter(k => G.goods[k] > 0 || G.store[k] > 0) : [];
  const req = requestNow(), reqNote = req.active ? ' · 托付 1 条在身上' : req.offer ? ' · 邻居托付 1 条' : '';
  $('panel').innerHTML = `${clockHtml()}
    <div class="acts">
      ${left > 0 ? `<button type="button" class="big" data-a="out">${toWharf ? '出门 · 去河埠' : '出门找东西'}<small>${toWharf ? '推开家门，沿河走走' : '越远东西越好，也越危险。天黑前要回来'}</small></button>` : ''}
      <button type="button" class="big" data-a="market">去集市卖货<small>我的 ${storeCount(G.goods) + G.personalTreasures.length} 件 · 家里的 ${storeCount() + G.treasures.length} 件${reqNote}</small></button>
      <button type="button" class="big" data-a="build">修院子<small>${DOORS[G.door].name}（门血 ${DOORS[G.door].hp}）${trapSummary()}</small></button>
    </div>
    ${yardMore(left, toWharf, heals)}
    <div class="acts">
      <button type="button" class="big ${left > 0 ? 'ghosty' : 'main'}" data-a="night">${left > 0 ? '在家歇到天黑' : '天黑了，去守夜'}<small>${left > 0 ? `还有 ${dur(left)} 天黑，鬼会来砸门` : '鬼要来砸门了'}</small></button>
    </div>`;
  bindActs({ out: () => askBuddy(toWharf), river: () => askBuddy(true), place: River.placeStone, market: openMarket, build: openBuild, friends: openFriends, family: openFamily, stove: openStove, night: chooseNightWatch });
  $('panel').querySelectorAll('[data-heal]').forEach(b => { b.onclick = () => heal(b.dataset.heal); });
}
// 不是天天要用的事：一排小按钮，第二行写一句状态（太长就省略）
function yardMore(left, toWharf, heals) {
  const more = (a, label, note, extra = '') => `<button type="button" class="more" data-a="${a}"${extra}><span>${label}</span><small>${note}</small></button>`;
  const items = [];
  if (left > 0 && !toWharf) items.push(more('river', '河埠', '沿河走走'));
  if (stoveOpen()) {
    const st = stoveState(), name = stoveProduct();
    items.push(more('stove', '灶台', st === 'ready' ? `${name}好了` : st === 'cooking' ? `在烧${name}` : '空着'));
  }
  for (const k of heals) items.push(more('heal', `${k}疗伤`, `体力 +${TRADE.heal[k]}`, ` data-heal="${k}"`));
  if (Guidance.open(3)) items.push(more('family', '家和祠堂', familySummary()));
  if (Guidance.open(4)) {
    const best = NEIGHBORS.slice().sort((a, b) => G.friends[b.id] - G.friends[a.id])[0];
    items.push(more('friends', '邻居', `${best.who} 交情 ${G.friends[best.id]}`));
  }
  if (G.river?.stone === 'yard') items.push(more('place', '院石', '换个摆法'));
  return items.length ? `<div class="yard-more" role="group" aria-label="院里的其他事">${items.join('')}</div>` : '';
}
function chooseNightWatch() {
  if (G.phase !== 'home') return;
  const chance = LoopCore.chanceLabel(LoopCore.defenseChance(G.day, G.door, G.traps));
  const lossText = G.lifeNo === 1 ? '第一世有保护，门破了也不丢钱'
    : `门破了钱箱最多丢 ${LoopCore.autoLossLimit(G.chest, G.lifeNo)} 文`;
  const commit = start => {
    if (G.phase !== 'home') return;
    G.time = Math.max(G.time, CFG.dusk);
    return start();
  };
  sheet({
    title: '今晚怎么守门？', dismiss: true, focusTitle: true,
    body: `<p>第 ${G.day} 晚 · ${DOORS[G.door].name}${trapSummary()}</p>`,
    buttons: [
      ['亲手守<small>亲自迎敌，波间能挑本事。守住得全份因果。</small>', () => commit(() => startNight(false)), 'night-choice'],
      [`交给机关<small>守住的把握${chance} · ${lossText}。守住得半份因果。</small>`, () => commit(delegateNight), 'night-choice'],
      ['回院子', null, 'choice-back'],
    ],
    bind: el => {
      el.querySelector('[data-i="0"]').dataset.a = 'manual';
      el.querySelector('[data-i="1"]').dataset.a = 'delegate';
    },
  });
}
function heal(kind = '草药') {
  if (G.hp >= CFG.hpMax) return;
  const used = LoopCore.useHealing(G, G, kind);
  if (!used) return;
  Guidance.done('heal');
  const before = G.hp;
  G.hp = Math.min(CFG.hpMax, G.hp + used.amount);
  save(); render();
  toast(`用了${used.owner === 'person' ? '自己的' : '仓库的'}${kind}，体力 +${G.hp - before}`);
}

function marketSection(owner) {
  const mine = owner === 'person';
  const stock = mine ? G.goods : G.store, treasures = mine ? G.personalTreasures : G.treasures;
  const goods = Object.entries(stock).filter(([, n]) => n > 0);
  const pocket = mine ? '钱袋' : '钱箱';
  const prices = todayPrices();
  const rows = goods.map(([kind, n]) => `<li data-good-kind="${kind}"><div><b>${kind} ×${n}</b><small>每件 ${prices[kind]} 文${trendTag(prices, kind)} · 共 ${prices[kind] * n} 文</small></div>
    <button type="button" class="mini" data-quantity="one" aria-label="卖 1 件${kind}">卖 1 件</button>
    <button type="button" class="mini" data-quantity="all" aria-label="全卖${kind}">全卖</button></li>`).join('');
  const valuableRows = treasures.map((t, i) => `<li><b>${t.n}</b><span>${t.v} 文</span>
    ${mine ? `<button type="button" class="mini" data-shelve="${i}">上架</button>` : ''}
    <button type="button" class="mini" data-sell="${i}">卖掉</button></li>`).join('');
  return `<section class="market-owner" data-owner="${owner}" aria-label="${mine ? '我的' : '家里的'}">
    <h3>${mine ? '我的' : '家里的'}<span>卖了进${pocket} · 现有 ${mine ? G.purse : G.chest} 文</span></h3>
    ${rows ? `<ul class="list market-stock">${rows}</ul>` : ''}
    ${rows ? `<button type="button" class="mini market-bulk" data-sell-all>普通货全卖了（+${LoopCore.goodsValue(stock, prices)} 文）</button>` : ''}
    ${valuableRows ? `<small>${mine ? '我的宝物' : '宝物架'}</small><ul class="list">${valuableRows}</ul>` : ''}
    ${!rows && !valuableRows ? `<small class="note">${mine ? '手里还没有货。' : '仓库和宝物架都空着。'}</small>` : ''}</section>`;
}

function openMarket() {
  const hasThings = storeCount(G.goods) + G.personalTreasures.length > 0;
  const transfer = (hasThings || G.purse) ? `<details class="market-transfer"><summary>放进家里</summary>
    <small class="note">存进家里就归全家，钱箱只能花在家上。</small>
    ${hasThings ? '<p><button type="button" class="mini" data-store-all>物品全归家（货进仓库，宝物上架）</button></p>' : ''}
    ${G.purse ? `<label>存钱<input id="deposit-amount" type="number" inputmode="numeric" min="1" max="${G.purse}" step="1" value="${G.purse}">文</label><button type="button" class="mini" data-deposit>放进钱箱</button>` : ''}</details>` : '';
  sheet({
    title: '集市', dismiss: true,
    body: River.marketGreeting() + requestSection() + marketSection('person') + marketSection('house') + transfer,
    buttons: [['回去', null]],
    bind: (el) => {
      for (const section of el.querySelectorAll('[data-owner]')) {
        const owner = section.dataset.owner;
        section.querySelectorAll('[data-quantity]').forEach(b => {
          b.onclick = () => sellGoods(owner, b.closest('[data-good-kind]').dataset.goodKind, b.dataset.quantity);
        });
        const bulk = section.querySelector('[data-sell-all]');
        if (bulk) bulk.onclick = () => sellAll(owner);
        section.querySelectorAll('[data-sell]').forEach(b => {
          b.onclick = () => {
            const item = LoopCore.sellTreasure(G, G, owner, Number(b.dataset.sell));
            if (item) sold(owner, item.v, item.n);
          };
        });
        section.querySelectorAll('[data-shelve]').forEach(b => {
          b.onclick = () => {
            if (LoopCore.shelveTreasure(G, G, Number(b.dataset.shelve))) refreshMarket('已摆上家里的宝物架');
          };
        });
      }
      const accept = el.querySelector('[data-accept]');
      if (accept) accept.onclick = acceptRequest;
      const deliver = el.querySelector('[data-deliver]');
      if (deliver) deliver.onclick = deliverRequest;
      const store = el.querySelector('[data-store-all]');
      if (store) store.onclick = () => {
        LoopCore.storeBelongings(G, G);
        refreshMarket('货已进仓，宝物已上架');
      };
      const deposit = el.querySelector('[data-deposit]');
      if (deposit) deposit.onclick = () => {
        const input = el.querySelector('#deposit-amount'), n = input.valueAsNumber;
        if (!LoopCore.depositCoins(G, G, n)) { input.focus(); toast('请输入钱袋里够付的整文数'); return; }
        refreshMarket(`钱袋里的 ${n} 文已放进钱箱`);
      };
    },
  });
  Guidance.speak('货可以一件件卖，也能全卖。', true);
}

function refreshMarket(message) { save(); render(); openMarket(); toast(message); }

function sold(owner, value, label) {
  if (!value) return;
  Guidance.done('sell'); G.guideSoldDay = G.day;
  G.earned += value;
  refreshMarket(`卖了${label}，${owner === 'person' ? '钱袋' : '钱箱'} +${value} 文`);
}

function sellGoods(owner, kind, quantity) {
  const prices = todayPrices();
  const value = LoopCore.sellOrdinary(G, G, owner, kind, quantity === 'all' ? 'all' : 1, prices);
  sold(owner, value, `${kind} ×${value / prices[kind]}`);
  $('sheet').querySelector(`[data-owner="${owner}"] [data-good-kind="${kind}"] [data-quantity="one"]`)?.focus({preventScroll: true});
}

function sellAll(owner) { sold(owner, LoopCore.sellAllOrdinary(G, G, owner, todayPrices()), '普通货'); }

// ---------------- 第四阶段：每天的行情、院里的灶、邻居托付 ----------------
// 规则都在 src/core/loop/trade.ts；这里只负责画出来、把按钮接上。
const TRADE = LoopCore.TRADE;
const NEIGHBOR_IDS = NEIGHBORS.map(n => n.id);
function todayPrices() { return LoopCore.dayPrices(G.lifeId, G.day); }
function trendTag(prices, kind) {
  const t = LoopCore.priceTrend(prices, kind);
  return t ? `<em class="trend ${t}">${t === 'up' ? '今天贵' : '今天便宜'}</em>` : '';
}
function stoveOpen() { return Guidance.open(TRADE.unlock.stove) || !!G.stove; }
function stoveState() { return LoopCore.stoveStatus(G.stove, G.lifeId, G.day); }
function stoveProduct() { return G.stove ? TRADE.recipes[G.stove.recipe].name : ''; }
function canCookAny() {
  return Object.keys(TRADE.recipes).some(r => LoopCore.canCook(G, G, r, 'person') || LoopCore.canCook(G, G, r, 'house'));
}
function requestsOpen() { return Guidance.open(TRADE.unlock.requests); }
function requestNow() {
  return requestsOpen() ? LoopCore.requestBoard(G, G.lifeId, G.day, NEIGHBOR_IDS) : { active: null, offer: null };
}
function requestDeliverable() {
  const { active } = requestNow();
  return active && LoopCore.planDelivery(G, G).short === 0 ? active : null;
}
function stoveSummary() {
  const state = stoveState();
  if (state === 'ready') return `${stoveProduct()}烧好了`;
  if (state === 'cooking') return `在烧${stoveProduct()}，过完今晚就好`;
  return '空着：睡前放进去，明早就好';
}
function openStove() {
  const state = stoveState();
  let body;
  if (state === 'ready') {
    const mine = G.stove.owner === 'person' && G.stove.lifeId === G.lifeId;
    body = `<p>灶里的<b>${stoveProduct()}</b>烧好了，取出来${mine ? '归你自己' : '进家里的仓库'}。</p>`;
  } else if (state === 'cooking') {
    body = `<p>灶里在烧<b>${stoveProduct()}</b>。过完今晚，明早就能取。</p>`;
  } else {
    const rows = Object.entries(TRADE.recipes).map(([id, r]) => {
      const input = Object.entries(r.input).map(([k, n]) => `${n} ${k === '柴' ? '件' : '份'}${k}`).join('、');
      const use = owner => LoopCore.canCook(G, G, id, owner);
      return `<li><div><b>${input} → ${r.count} ${r.output === '木炭' ? '件' : '份'}${r.name}</b><small>值 ${GOODS[r.output]} 文${r.output === '金疮药' ? ' · 疗伤回 2 点体力' : ''}</small></div>
        <button type="button" class="mini" data-cook="${id}" data-owner-cook="person"${use('person') ? '' : ' disabled'}>用自己的</button>
        <button type="button" class="mini" data-cook="${id}" data-owner-cook="house"${use('house') ? '' : ' disabled'}>用家里的</button></li>`;
    }).join('');
    body = `<p class="note">一次烧一锅。用谁的料，烧好的就是谁的。</p><ul class="list stove-list">${rows}</ul>`;
  }
  sheet({
    title: '灶台', dismiss: true, body,
    buttons: [...(state === 'ready' ? [['取出来', collectStove, 'main']] : []), ['回去', null]],
    bind: el => el.querySelectorAll('[data-cook]').forEach(b => {
      b.onclick = () => startStove(b.dataset.cook, b.dataset.ownerCook);
    }),
  });
}
function startStove(recipe, owner) {
  if (G.phase !== 'home') return;
  const job = LoopCore.startStove(G, G, recipe, owner, { lifeId: G.lifeId, day: G.day });
  if (!job) return toast('料不够');
  Guidance.done('kiln'); G.guideStove = true;
  save(); render();
  toast(`${TRADE.recipes[recipe].name}下锅了，明早就好`);
}
function collectStove() {
  if (G.phase !== 'home') return;
  const got = LoopCore.collectStove(G, G, { lifeId: G.lifeId, day: G.day });
  if (!got) return;
  Guidance.done('stove');
  save(); render();
  toast(`取出 ${got.count} ${got.kind === '木炭' ? '件' : '份'}${got.kind}，${got.owner === 'person' ? '归你自己' : '进了家里的仓库'}`);
}
function requestSection() {
  if (!requestsOpen()) return '';
  const { active, offer } = requestNow();
  const who = id => nb(id).who;
  const unit = kind => (kind === '柴' || kind === '木炭' || kind === '兽皮') ? '件' : '份';
  if (active) {
    const plan = LoopCore.planDelivery(G, G);
    const due = active.dueDay === G.day ? '今天要交' : '明天之前交';
    const parts = [plan.person && `自己的 ${plan.person}`, plan.house && `家里的 ${plan.house}`].filter(Boolean).join(' + ') + ` ${unit(active.kind)}`;
    return `<section class="request-card" data-request="active"><h3>邻居托付</h3>
      <p>${who(active.neighbor)}托你带 <b>${active.count} ${unit(active.kind)}${active.kind}</b>，给 ${active.pay} 文，交情 +${TRADE.request.friendship}。${due}，没交也不罚。</p>
      ${plan.short ? `<small class="note">还差 ${plan.short} ${unit(active.kind)}。</small>` : `<button type="button" class="mini" data-deliver>交货（${parts}）</button>`}</section>`;
  }
  if (offer) {
    return `<section class="request-card" data-request="offer"><h3>邻居托付</h3>
      <p>${who(offer.neighbor)}：「想要 ${offer.count} ${unit(offer.kind)}${offer.kind}，给你 ${offer.pay} 文。」</p>
      <small class="note">比卖给集市多给五成，交了交情 +${TRADE.request.friendship}。两天内交，没交也不罚。</small>
      <button type="button" class="mini" data-accept>接下</button></section>`;
  }
  return '<section class="request-card" data-request="none"><h3>邻居托付</h3><small class="note">今天没有新的托付了。</small></section>';
}
function acceptRequest() {
  if (G.phase !== 'home') return;
  const r = LoopCore.acceptRequest(G, G.lifeId, G.day, NEIGHBOR_IDS);
  if (r) refreshMarket(`接下了${nb(r.neighbor).who}的托付`);
}
function deliverRequest() {
  if (G.phase !== 'home') return;
  const paid = LoopCore.deliverRequest(G, G, { lifeId: G.lifeId, day: G.day });
  if (!paid) return;
  Guidance.done('deliver');
  G.earned += paid.purse + paid.chest;
  const money = [paid.purse && `钱袋 +${paid.purse}`, paid.chest && `钱箱 +${paid.chest}`].filter(Boolean).join('，');
  refreshMarket(`交到了：${money} 文，和${nb(paid.neighbor).who}的交情 +${paid.friendship}`);
}

function paymentText({chest, purse, shortfall}) {
  return `钱箱 ${chest} 文 + 钱袋 ${purse} 文${shortfall ? `，还差 ${shortfall} 文` : ''}`;
}

function openBuild() {
  const next = DOORS[G.door + 1];
  const doorQuote = next && LoopCore.quoteHome(G, G, next.cost);
  const currentChance = LoopCore.defenseChance(G.day, G.door, G.traps);
  const currentLabel = LoopCore.chanceLabel(currentChance);
  const preview = (door, traps) => {

  }
  const perks = Object.entries(night.pk).map(([id, count]) => PERKS[id].n + (count > 1 ? ` ×${count}` : '')).join('、');
  if (perks) paragraphs.push(`今晚挑的本事：${perks}`);

  if (names) paragraphs.push(`今晚来砸门的：${names}……真游戏里，大部分是电脑鬼，偶尔会有死去的真人玩家变成的厉鬼。`);

function endNight(won) {
  if (!N || N.over) return;

  cancelAnimationFrame(raf);
  if (!won) { battle.door = 0; updateDoor(); }
  const item = G.item, friends = { ...G.friends };
  return withGameLock(() => {
    const stored = storedGame();
    if (stored?.phase === 'dawn' && stored.nightReceipt && LoopCore.sameNight(expected, stored.nightReceipt)) {
      adoptStoredGame(); showNightReceipt(G.nightReceipt); return;
    }
    if (!stored?.nightPlan || stored.phase !== (expected.guardian ? 'guard' : 'night')
        || !LoopCore.sameNight(expected, stored.nightPlan)) { location.reload(); return; }
    adoptStoredGame();
    const receipt = LoopCore.settleNightLedger(G, expected, { won, kills: battle.kills, coins: battle.coins },
      result => describeNight(result, battle));
    if (!receipt) { location.reload(); return; }
    delete G.battleResume;
    G.item = item;
    for (const [id, value] of Object.entries(friends)) {
      if (value > (battle.startingFriends[id] || 0)) G.friends[id] = Math.max(value, G.friends[id] || 0);
    }
    if (!save()) return;
    if (won) Guidance.done('fight');

  });
}
function showNightReceipt(receipt) {

function startHaunt() {

function hauntSvg() {

  $('hd-num').textContent = `${Math.max(0, Math.ceil(H.door))}`;

function dodge() { if (!H || !LoopCore.hauntDodge(H)) return; $('hme').style.transform = 'translate(62px, 492px)'; }
function bash() {

      <label for="code-in">导入别人的人</label><textarea id="code-in" placeholder="WULIN1:..."></textarea><button type="button" class="big" id="use-code">用这个人</button><p class="note" id="code-msg" role="status"></p></details>
      <label class="bank-toggle"><input type="checkbox" id="river-text"${G.river?.textOn ? ' checked' : ''}>文字说明（河埠）</label>
      <label class="bank-toggle"><input type="checkbox" id="ancestor-on"${G.guideOff ? '' : ' checked'}>祖宗带路</label>
      ${canReadReports ? '<div class="waiting-actions"><button type="button" class="mini" data-a="reports">家宅战报</button><button type="button" class="mini" data-a="summary">回来时的摘要</button></div>' : ''}
      <div class="sub">试玩用</div>
      <label class="bank-toggle"><input type="checkbox" id="all-features"${G.allFeatures ? ' checked' : ''}>全部开放（试玩用）</label>
      <button type="button" class="big" id="copy-river-log">复制试玩记录</button><div id="river-copy-status" role="status"></div>
      <label class="bank-toggle"><input type="checkbox" id="unlimited-days"${G.unlimitedDays ? ' checked' : ''}>不限天数（试玩用）</label>
      <label class="bank-toggle"><input type="checkbox" id="skip-afterlife"${G.skipAfterlife ? ' checked' : ''}${LoopCore.AFTERLIFE.night ? '' : ' disabled checked'}>老死后直接下一世，不当鬼（试玩用）</label>
      <button type="button" class="big" id="ff"${playing && G.day < CFG.lifeDays ? '' : ' disabled'}>快进到最后一天<small>${waiting && !G.bankedDays && !G.unlimitedDays ? '明天才能快进' : '直接试老死、当鬼和投胎'}</small></button>
      <button type="button" class="big" id="restart">从头再来<small>清掉这一局，回到第一世</small></button>
      <p class="note">这是样机：邻居、来砸门的鬼、被你砸门的人家都用电脑代替；所有数字都是占位。</p>`,
    buttons: [['关上', null]],
    bind: (el) => {
      const reports = el.querySelector('[data-a=reports]');
      if (reports) {
        reports.onclick = () => showHouseReports();
        el.querySelector('[data-a=summary]').onclick = () => openReturnSummary();
      }
      el.querySelector('#ancestor-on').onchange = e => {
        G.guideOff = !e.target.checked; Guidance.silence(); save(); Guidance.resetIdle();
      };
      el.querySelector('#all-features').onchange = e => {
        G.allFeatures = e.target.checked; alignUnlockedScene(); save(); render();
        if (N && !N.over && ['night','guard'].includes(G.phase)) { renderNightPanel(); drawPlayer(); }
      };
      el.querySelector('#river-text').onchange = e => River.setText(e.target.checked);
      el.querySelector('#copy-river-log').onclick = River.copyLog;
      el.querySelector('#unlimited-days').onchange = event => { G.unlimitedDays = event.target.checked; save(); render(); };
      el.querySelector('#skip-afterlife').onchange = event => { G.skipAfterlife = event.target.checked; save(); render(); };
      el.querySelector('#edit-look').onclick = () => openEditor(openMenu);
      const expressions = el.querySelector('#settings-expressions');
      if (expressions) expressions.onclick = openExpressions;
      el.querySelector('#code-out').value = encode(ME);
      el.querySelector('#use-code').onclick = async () => {
        try { await applyLook(decode(el.querySelector('#code-in').value)); el.querySelector('#code-out').value = encode(ME); el.querySelector('#code-msg').textContent = '换好了'; }
        catch (e) { el.querySelector('#code-msg').textContent = e instanceof DOMException && e.name !== 'InvalidCharacterError' ? '存档写入失败，请检查浏览器存储。' : '这串码读不出来，请检查捏人码是否完整。'; }
      };
      el.querySelector('#ff').onclick = () => { closeSheet(); G.day = CFG.lifeDays; G.phase = 'home'; G.at = 'home'; G.bag = []; G.buddy = null; save(); render(); toast('快进到了最后一天'); };
      el.querySelector('#restart').onclick = async () => { closeSheet(); cancelAnimationFrame(raf); N = null; H = null; G = freshLife(FIRST_FAMILY, null); if (await writeGame(G, true)) render(); };
    },
  });
}
// Keep possessions when an early save resumes on a route that is still closed.
function alignUnlockedScene() {
  let changed = false;
  if (!Guidance.open(2)) {
    changed = G.item !== 'sword';
    G.item = 'sword';
    if (G.phase === 'river') {
      changed ||= !!G.buddy || G.river?.focus === 'far';
      G.buddy = null;
      if (G.river?.focus === 'far') G.river.focus = null;
    }
  }
  if (G.phase !== 'map') return changed;
  if (!Guidance.open(2) || (G.at !== 'home' && SPOTS[G.at]?.ring === 2 && !Guidance.open(3))) {
    if (G.field) { G.field.encounter = null; G.field.duskLead = ''; }
    arriveHome();
    return true;
  }
  if (SPOTS[G.target]?.ring === 2 && !Guidance.open(3)) { G.target = null; return true; }
  return changed;
}

// ================= 键盘 =================
document.addEventListener('keydown', (e) => {
  if (avatarDialog.open) return;
  if (!$('sheet').hidden) {
    if (e.key === ' ' && e.target.id === 'sh-t') e.preventDefault();
    if (e.key === 'Escape' && $('sheet').dataset.dismiss) closeSheet();
    const n = ['1', '2', '3'].indexOf(e.key);
    if (n >= 0 && $('sheet').dataset.num) { const b = $('sheet').querySelectorAll('.sh-btns button')[n]; if (b) b.click(); }
    return;
  }
  if ((G.phase === 'night' || G.phase === 'guard') && N && !N.over) {
    const i = ['1', '2', '3'].indexOf(e.key);
    if (i >= 0) setItem(ITEMS[i][0]);
    if (e.key === ' ' || e.key === 'j') { e.preventDefault(); autoHit(); }
  }
  if (G.phase === 'haunt' && H && !H.over) {
    if (e.key === ' ' || e.key === 'j') { e.preventDefault(); bash(); }
    if (e.key === 'k' || e.key === 'ArrowLeft') { e.preventDefault(); dodge(); }
  }
});

// ================= 启动 =================
G = loadGame();
if (!G) G = freshLife(FIRST_FAMILY, null);
else if (!G.lastActiveDate) {
  LoopCore.markActiveDate(G, localDateKey());
  save();
} else if (localDateKey() <= G.lastActiveDate && accrueDays()) save();
if (G.look) { try { ME = validatedLook(G.look); } catch (e) {} }
G.look = ME;
Guidance.bind();
if (localDateKey() > G.lastActiveDate) {
  if (!document.hidden) visitCalendar(false, true);
} else {
  if (alignUnlockedScene()) save();
  resumeScene();
}
window.addEventListener('focus', () => visitCalendar());
window.addEventListener('storage', event => { if (event.key === 'wulin-loop') updateCalendar(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { lastVisibleTick = 0; checkpointNight(); }
  else visitCalendar(false, !document.body.dataset.phase);
});
window.addEventListener('pagehide', checkpointNight);
window.addEventListener('pageshow', e => { if (e.persisted) visitCalendar(); });
scheduleCalendar();
</script>
</body></html>
