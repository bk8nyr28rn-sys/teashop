h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; margin: 0; }
.muted { color: var(--muted); }

.items { display: flex; gap: 8px; }

.item[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.item i { width: 12px; height: 12px; border-radius: 50%; }
.status { font-size: 13px; color: var(--muted); min-height: 20px; margin: 0; }
.status b { color: var(--ink); }
.pick { position: fixed; inset: 0; background: rgba(5, 8, 18, 0.62); display: flex; align-items: flex-end; justify-content: center; z-index: 5;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pick .card { width: 100%; max-width: 508px; }
.perk small { display: block; }
.popup { border-color: var(--seal); box-shadow: 0 0 0 2px rgba(224, 101, 79, 0.35); animation: pulse 1.2s ease-in-out infinite alternate; }

.verify.ok { border: 1px solid var(--good); }

.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin: 0; }
.stat dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.dmg { font-size: 13px; font-weight: 700; fill: #FFE7A8; paint-order: stroke; stroke: #0B0F1E; stroke-width: 3px; pointer-events: none; }
.dmg.guest { fill: #A8E6FF; }
.dmg.good { fill: var(--good); }

const lerp = (a, b, t) => a + (b - a) * t;

function bodyGeom(s) {
  const { cx, hcy, ry } = headGeom(s);
  const rx = ry * (0.9 + 0.2 * s.faceWidth);
  const shoulderY = hcy + ry + 2;
  const bodyLen = 392 - shoulderY;
  const torso = bodyLen * (0.5 - 0.1 * s.height);
  const waistY = shoulderY + torso * 0.72, hipY = shoulderY + torso;
  const sw = rx * 0.6 + s.build * 14, hw = sw * 0.92 + s.build * 4;
  const legW = 15 + s.build * 6, legGap = 5;
  return { cx, hcy, ry, rx, shoulderY, waistY, hipY, sw, hw, legW, legGap };
}

function layerBox(s, key, geometry = bodyGeom(s)) {
  const { cx, hcy, ry, rx, shoulderY, waistY, hipY, sw, hw } = geometry;
  const centered = (halfWidth, y, bottom) => ({ x: cx - halfWidth, y, w: halfWidth * 2, h: bottom - y });
  switch (key) {
    case 'hairFront': return centered(rx * 1.38, 0, hcy + ry * 1.3);
    case 'hairBack': return centered(rx * 1.65, 0, hcy + ry * 4);
    case 'head': return centered(rx * 1.75, 0, hcy + ry * 1.4);
    case 'top': return centered(Math.max(sw, hw) + 25, shoulderY - 8, 392);
    case 'back': return centered(108, Math.max(0, shoulderY - 85), 392);
    case 'sleeve': return { x: cx - sw - 36, y: shoulderY - 4, w: 52, h: hipY - shoulderY + 25 };
    case 'bottom': return centered(hw + 28, waistY - 8, 392);
    case 'shoes': return centered(hw + 12, 348, 398);
    case 'emblem': {
      const e = sw * 0.95;
      return centered(e / 2, lerp(shoulderY, waistY, 0.22), lerp(shoulderY, waistY, 0.22) + e);
    }
    case 'cloth': {
      const tile = 16 + 48 * s.tileSize;
      return centered(tile / 2, shoulderY, shoulderY + tile);
    }
    default: return { x: cx - 1.45 * ry, y: hcy - 1.5 * ry, w: 2.9 * ry, h: 2.9 * ry };
  }
}

function drawPerson(s0, expr, age, opt = {}) {
  const U = opt.uid || '';
  const s = { ...s0 };
  const D = s.draw?.v === 2 && s.draw.bindings ? s.draw : normDraw(s.draw);
  const only = D.customOnly || {};
  if (only.head) { s.head = 'none'; s.ear = 'none'; s.neck = 'none'; }
  if (only.back) { s.cape = 'none'; s.weapon = 'none'; }
  if (only.face) { s.blush = 0; s.beard = 'none'; s.mark = 'none'; s.mole = false; s.nose = 'none'; s.glasses = 'none'; }
  if (age === 'elder') { s.hairColor = '#E6E4DE'; s.streak = 'none'; }
  const browColor = age === 'elder' ? '#D8D4CC' : s.browFollow ? s.hairColor : s.browColor;
  const geometry = bodyGeom(s);
  const { cx, hcy, ry, rx, shoulderY, waistY, hipY, sw, hw, legW, legGap } = geometry;
  function inkLayer(key, mirrored = false) {
    if (key === opt.skip || !D[key]?.length) return '';
    const { x, y, w, h } = layerBox(s, key, geometry);
    const flip = mirrored ? `translate(${2 * cx} 0) scale(-1 1) ` : '';
    const bone = mirrored ? 'armRight' : D.bindings[key];
    return `<g data-draw-layer="${key}" data-bone="${bone}" transform="${flip}translate(${x} ${y}) scale(${w} ${h})">${strokesSvg(D[key])}</g>`;
  }

  // ---- 身体的各层 ----
  const behind = []; // 披风、背着的兵器
  const body = [];
  const front = []; // 手里的兵器、拐杖
  const hand = { lx: cx - sw - 10, rx: cx + sw + 10, y: hipY + 4 };

  // 披风
  if (s.cape !== 'none') {
    const bottom = s.cape === 'long' ? 378 : lerp(shoulderY, 392, 0.55);
    behind.push(`<path d="M${cx - sw - 2} ${shoulderY + 6} Q${cx - sw - 26} ${lerp(shoulderY, bottom, 0.6)} ${cx - sw - 18} ${bottom} Q${cx} ${bottom + 10} ${cx + sw + 18} ${bottom} Q${cx + sw + 26} ${lerp(shoulderY, bottom, 0.6)} ${cx + sw + 2} ${shoulderY + 6} Z" fill="${s.capeColor}"/>`);
  }
  // 背着的兵器
  const W = s.weapon;
  const onBack = s.weaponPos === 'back' && ['sword', 'saber', 'umbrella', 'flute', 'bow'].includes(W);
  if (onBack) behind.push(weaponBack(W, cx, shoulderY, hipY, s.weaponColor, s.trimColor));
  behind.push(inkLayer('back'));

  // 腿和鞋
  const legTop = hipY - 8, legBot = 382;
  const lx1 = cx - legGap / 2 - legW, lx2 = cx + legGap / 2;
  const longRobe = !only.top && ['changshan', 'daopao'].includes(s.top);
  const skirt = !only.bottom && ['skirt', 'pleat'].includes(s.bottom);
  const shoe = (x) => {
    const c = s.shoeColor;
    if (s.shoes === 'boots') return `<path d="M${x - 1} ${legBot - 14} h${legW + 2} v10 q8 2 8 9 h-${legW + 10} Z" fill="${c}"/>`;
    if (s.shoes === 'straw') return `<ellipse cx="${x + legW / 2 + 2}" cy="${legBot + 5}" rx="${legW / 2 + 6}" ry="5" fill="#C9A86A"/><path d="M${x + 2} ${legBot + 1} L${x + legW} ${legBot - 6}" stroke="#8A6A3C" stroke-width="2"/>`;
    return `<ellipse cx="${x + legW / 2 + 2}" cy="${legBot + 4}" rx="${legW / 2 + 5}" ry="6" fill="${c}"/>`;
  };
  if (only.top || only.bottom) {
    body.push(`<path d="M${cx - sw} ${shoulderY + 9} Q${cx} ${shoulderY - 8} ${cx + sw} ${shoulderY + 9} Q${cx + hw * 0.7} ${waistY} ${cx + hw * 0.8} ${hipY - 7} Q${cx} ${hipY + 15} ${cx - hw * 0.8} ${hipY - 7} Q${cx - hw * 0.7} ${waistY} ${cx - sw} ${shoulderY + 9} Z" fill="${s.skin}"/>`);
  }
  if (!skirt) {
    const legColor = only.bottom ? s.skin : s.bottomColor;
    body.push(`<rect x="${lx1}" y="${legTop}" width="${legW}" height="${legBot - legTop + 4}" rx="7" fill="${legColor}"/><rect x="${lx2}" y="${legTop}" width="${legW}" height="${legBot - legTop + 4}" rx="7" fill="${legColor}"/>`);
    if (!only.bottom && s.bottom === 'wrap') {
      for (const x of [lx1, lx2]) for (let y = legBot - 40; y < legBot - 6; y += 7) body.push(`<path d="M${x} ${y + 5} L${x + legW} ${y}" stroke="#F4ECDD" stroke-width="2.4" opacity="0.8"/>`);
    }
  }
  if (only.shoes) {
    for (const x of [lx1, lx2]) body.push(`<ellipse cx="${x + legW / 2 + 1}" cy="385" rx="${legW / 2 + 2}" ry="6" fill="${s.skin}"/>`);
  } else body.push(shoe(lx1 - 3) + shoe(lx2 - 1));
  body.push(inkLayer('shoes'));
  if (skirt) {
    const top = waistY - 2;
    body.push(`<path d="M${cx - hw} ${top} L${cx + hw} ${top} L${cx + hw + 22} ${legBot} Q${cx} ${legBot + 6} ${cx - hw - 22} ${legBot} Z" fill="${s.bottomColor}"/>`);
    if (s.bottom === 'pleat') for (let i = -3; i <= 3; i++) body.push(`<path d="M${cx + i * hw * 0.28} ${top + 8} L${cx + i * (hw + 22) * 0.28} ${legBot - 2}" stroke="#000" stroke-opacity="0.15" stroke-width="1.5"/>`);
  }
  body.push(inkLayer('bottom'));

  // 上衣
  let topBottom = hipY + 6;
  if (longRobe) topBottom = 376;
  else if (s.top === 'yuanling') topBottom = lerp(hipY, 382, 0.5);
  else if (s.top === 'ru') topBottom = waistY + 2;
  else if (s.top === 'duangua' || s.top === 'vest') topBottom = hipY;
  const flare = longRobe ? 20 : s.top === 'yuanling' ? 12 : 3;
  const torsoPath = `M${cx - sw} ${shoulderY + 8} Q${cx} ${shoulderY - 6} ${cx + sw} ${shoulderY + 8} L${cx + hw + flare} ${topBottom} Q${cx} ${topBottom + (longRobe ? 6 : 2)} ${cx - hw - flare} ${topBottom} Z`;

  // 袖子（先画，衣身压在上面）
  const wide = s.sleeve === 'wide' || (!only.top && s.top === 'daopao');
  const sleeveColor = !only.top && s.top === 'vest' ? lighten(s.topColor, 0.55) : s.topColor;
  const sleeve = (side) => {
    const sx = cx + side * (sw - 3), sy = shoulderY + 10, hx = side < 0 ? hand.lx : hand.rx;
    if (wide) return `<path d="M${sx} ${sy - 4} Q${sx + side * 24} ${lerp(sy, hand.y, 0.5)} ${hx + side * 10} ${hand.y + 6} L${hx - side * 16} ${hand.y + 8} Q${sx - side * 2} ${lerp(sy, hand.y, 0.55)} ${sx - side * 10} ${sy + 8} Z" fill="${sleeveColor}"/><path d="M${hx + side * 10} ${hand.y + 6} L${hx - side * 16} ${hand.y + 8}" stroke="${s.trimColor}" stroke-width="4" stroke-linecap="round"/>`;
    return `<path d="M${sx} ${sy - 4} Q${sx + side * 14} ${lerp(sy, hand.y, 0.5)} ${hx + side * 6} ${hand.y - 4} L${hx - side * 8} ${hand.y - 2} Q${sx - side * 2} ${lerp(sy, hand.y, 0.5)} ${sx - side * 9} ${sy + 8} Z" fill="${sleeveColor}"/>`
      + (s.top === 'jin' || s.top === 'armor' ? `<rect x="${Math.min(hx + side * 6, hx - side * 8) - 1}" y="${hand.y - 14}" width="16" height="10" rx="3" fill="#2A2A33"/>` : '');
  };
  if (only.sleeve) {
    for (const side of [-1, 1]) {
      const wrist = side < 0 ? hand.lx : hand.rx;
      body.push(`<path d="M${cx + side * (sw - 4)} ${shoulderY + 13} Q${wrist} ${waistY} ${wrist} ${hand.y + 4}" fill="none" stroke="${s.skin}" stroke-width="14" stroke-linecap="round"/>`);
    }
  } else body.push(sleeve(-1), sleeve(1));
  body.push(inkLayer('sleeve'), inkLayer('sleeve', true));
  body.push(`<circle cx="${hand.lx}" cy="${hand.y + 6}" r="8" fill="${s.skin}"/><circle cx="${hand.rx}" cy="${hand.y + 6}" r="8" fill="${s.skin}"/>`);
  body.push(`<rect x="${cx - 9}" y="${hcy + ry * 0.7}" width="18" height="${shoulderY - hcy - ry * 0.7 + 6}" fill="${s.skin}"/>`);
  if (!only.top) body.push(`<path d="${torsoPath}" fill="${s.topColor}"/>`);
  // 花纹（剪在衣身里）
  const customPattern = (s.pattern === 'custom' || only.cloth) && opt.skip !== 'cloth' && D.cloth.length;
  if (customPattern) {
    const T = 16 + 48 * s.tileSize;
    body.push(`<defs><pattern id="cp${U}" patternUnits="userSpaceOnUse" x="${cx - T / 2}" y="${shoulderY}" width="${T}" height="${T}"><g data-draw-layer="cloth" data-bone="torso" transform="scale(${T})">${strokesSvg(D.cloth)}</g></pattern></defs>`);
    if (!only.top) body.push(`<clipPath id="tc2${U}"><path d="${torsoPath}"/></clipPath><rect clip-path="url(#tc2${U})" x="${cx - hw - 40}" y="${shoulderY - 10}" width="${(hw + 40) * 2}" height="${topBottom - shoulderY + 20}" fill="url(#cp${U})"/>`);
  } else if (!only.top && !only.cloth && s.pattern !== 'custom' && s.pattern !== 'none') body.push(`<clipPath id="tc${U}"><path d="${torsoPath}"/></clipPath><g clip-path="url(#tc${U})" opacity="0.55">${pattern(s.pattern, s.patternColor, cx - hw - 30, shoulderY - 10, (hw + 30) * 2, topBottom - shoulderY + 20)}</g>`);
  // 领口
  if (!only.top) {
    if (s.top === 'yuanling') body.push(`<path d="M${cx - 16} ${shoulderY + 2} Q${cx} ${shoulderY + 18} ${cx + 16} ${shoulderY + 2}" stroke="${s.trimColor}" stroke-width="5" fill="none"/>`);
    else if (s.top === 'duangua') body.push(`<path d="M${cx} ${shoulderY + 4} V${topBottom}" stroke="${s.trimColor}" stroke-width="3"/>${[0.35, 0.55, 0.75].map((t) => `<rect x="${cx - 7}" y="${lerp(shoulderY, topBottom, t)}" width="14" height="4" rx="2" fill="${s.trimColor}"/>`).join('')}`);
    else if (s.top === 'vest') body.push(`<path d="M${cx - 10} ${shoulderY + 2} L${cx} ${hipY - 6} L${cx + 10} ${shoulderY + 2}" fill="${lighten(s.topColor, 0.55)}"/><path d="M${cx - 10} ${shoulderY + 2} L${cx} ${hipY - 6} L${cx + 10} ${shoulderY + 2}" stroke="${s.trimColor}" stroke-width="3" fill="none"/>`);
    else body.push(`<path d="M${cx - 12} ${shoulderY + 2} L${cx + 10} ${lerp(shoulderY, waistY, 0.95)}" stroke="#F4ECDD" stroke-width="6" stroke-linecap="round"/><path d="M${cx + 12} ${shoulderY + 2} L${cx - 1} ${lerp(shoulderY, waistY, 0.55)}" stroke="#F4ECDD" stroke-width="6" stroke-linecap="round"/><path d="M${cx - 12} ${shoulderY + 2} L${cx + 10} ${lerp(shoulderY, waistY, 0.95)}" stroke="${s.trimColor}" stroke-width="2" stroke-linecap="round"/>`);
    if (s.top === 'daopao') body.push(`<path d="M${cx - hw - flare} ${topBottom} Q${cx} ${topBottom + 6} ${cx + hw + flare} ${topBottom}" stroke="${s.trimColor}" stroke-width="5" fill="none"/>`);
    if (s.top === 'armor') {
      for (let i = 0; i < 3; i++) body.push(`<path d="M${cx - sw + 6} ${shoulderY + 22 + i * 14} Q${cx} ${shoulderY + 30 + i * 14} ${cx + sw - 6} ${shoulderY + 22 + i * 14}" stroke="${s.trimColor}" stroke-width="7" fill="none"/>`);
      body.push(`<ellipse cx="${cx - sw}" cy="${shoulderY + 10}" rx="14" ry="9" fill="${s.trimColor}"/><ellipse cx="${cx + sw}" cy="${shoulderY + 10}" rx="14" ry="9" fill="${s.trimColor}"/>`);
    }
    // 腰带
    if (s.top !== 'duangua' && s.top !== 'vest') body.push(`<rect x="${cx - hw - (longRobe ? 4 : 2)}" y="${waistY - 5}" width="${(hw + (longRobe ? 4 : 2)) * 2}" height="10" rx="4" fill="${s.beltColor}"/>`);
  }
  const customTop = inkLayer('top');
  if (customTop && customPattern) {
    // 由手绘上衣的不透明区域裁出花纹，镂空、衣摆和轮廓均保留。
    body.push(`<g id="drawnTop${U}">${customTop}</g><mask id="drawnTopMask${U}" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="400"><use href="#drawnTop${U}"/></mask><rect width="240" height="400" fill="url(#cp${U})" mask="url(#drawnTopMask${U})"/>`);
  } else body.push(customTop);
  body.push(inkLayer('emblem'));
  // 颈饰
  if (s.neck === 'scarf') body.push(`<path d="M${cx - 18} ${shoulderY} Q${cx} ${shoulderY + 14} ${cx + 18} ${shoulderY} L${cx + 16} ${shoulderY + 12} Q${cx} ${shoulderY + 22} ${cx - 16} ${shoulderY + 12} Z" fill="${s.neckColor}"/><path d="M${cx + 8} ${shoulderY + 14} q6 22 -2 40 l10 -2 q6 -20 2 -38 Z" fill="${s.neckColor}"/>`);
  if (s.neck === 'pendant') body.push(`<path d="M${cx - 12} ${shoulderY} Q${cx} ${shoulderY + 30} ${cx + 12} ${shoulderY}" stroke="#2A2A33" stroke-width="1.5" fill="none"/><circle cx="${cx}" cy="${shoulderY + 24}" r="7" fill="${s.neckColor}"/><circle cx="${cx}" cy="${shoulderY + 24}" r="2.5" fill="${s.topColor}"/>`);
  // 披风前襟
  if (s.cape !== 'none') body.push(`<path d="M${cx - sw - 2} ${shoulderY + 6} Q${cx} ${shoulderY + 22} ${cx + sw + 2} ${shoulderY + 6}" stroke="${s.capeColor}" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="${cx}" cy="${shoulderY + 16}" r="5" fill="${s.trimColor}"/>`);
  // 手里或腰间的兵器
  if (W !== 'none' && !onBack) front.push(weaponHand(W, hand, waistY, hipY, s.weaponColor, s.trimColor, cx, hcy - ry * (s.head === 'hat' ? 1.5 : 1.2)));
  if (age === 'elder') front.push(`<path d="M${hand.lx} ${hand.y + 4} L${hand.lx - 8} 392" stroke="#8A5A3C" stroke-width="6" stroke-linecap="round"/><path d="M${hand.lx} ${hand.y + 4} q4 -10 -8 -12" stroke="#8A5A3C" stroke-width="6" fill="none" stroke-linecap="round"/>`);

  // ---- 头 ----
  const backHair = [];
  const headParts = [];
  const hc = s.hairColor;
  const len = s.hairLen;
  // 头发底（盖住头顶，画在脸后面）
  if (!only.hairBack) backHair.push(`<ellipse cx="${cx}" cy="${hcy - ry * 0.08}" rx="${rx * 1.07}" ry="${ry * 1.04}" fill="${hc}"/>`);
  if (!only.hairBack) switch (s.hairBack) {
    case 'highpony': backHair.unshift(`<path d="M${cx + rx * 0.35} ${hcy - ry * 0.85} Q${cx + rx * 1.5} ${hcy - ry * 0.9} ${cx + rx * 1.25} ${hcy + ry * 0.2} Q${cx + rx * 1.05} ${hcy + ry * (0.8 + 1.8 * len)} ${cx + rx * 1.35} ${hcy + ry * (1 + 2.2 * len)} Q${cx + rx * 0.6} ${hcy + ry * (0.8 + 1.8 * len)} ${cx + rx * 0.7} ${hcy + ry * 0.2} Q${cx + rx * 0.6} ${hcy - ry * 0.4} ${cx + rx * 0.2} ${hcy - ry * 0.55} Z" fill="${hc}"/>`); headParts.push(`<circle cx="${cx + rx * 0.45}" cy="${hcy - ry * 0.88}" r="${ry * 0.14}" fill="${s.trimColor}"/>`); break;
    case 'lowpony': backHair.unshift(`<path d="M${cx - rx * 0.3} ${hcy + ry * 0.5} Q${cx} ${hcy + ry * (1.2 + 2.6 * len)} ${cx + rx * 0.3} ${hcy + ry * 0.5} Z" fill="${hc}"/>`); break;
    case 'long': backHair.unshift(`<path d="M${cx - rx * 1.05} ${hcy} Q${cx - rx * 1.2} ${hcy + ry * (1 + 2.4 * len)} ${cx - rx * 0.7} ${hcy + ry * (1.3 + 2.6 * len)} L${cx + rx * 0.7} ${hcy + ry * (1.3 + 2.6 * len)} Q${cx + rx * 1.2} ${hcy + ry * (1 + 2.4 * len)} ${cx + rx * 1.05} ${hcy} Z" fill="${hc}"/>`); break;
    case 'buns': backHair.push(`<circle cx="${cx - rx * 0.78}" cy="${hcy - ry * 0.82}" r="${ry * 0.38}" fill="${hc}"/><circle cx="${cx + rx * 0.78}" cy="${hcy - ry * 0.82}" r="${ry * 0.38}" fill="${hc}"/>`); headParts.push(`<path d="M${cx - rx * 0.98} ${hcy - ry * 0.62} q${rx * 0.2} ${ry * 0.12} ${rx * 0.4} 0 M${cx + rx * 0.58} ${hcy - ry * 0.62} q${rx * 0.2} ${ry * 0.12} ${rx * 0.4} 0" stroke="${s.trimColor}" stroke-width="3" fill="none"/>`); break;
    case 'topknot': backHair.push(`<circle cx="${cx}" cy="${hcy - ry * 1.08}" r="${ry * 0.34}" fill="${hc}"/>`); headParts.push(`<rect x="${cx - ry * 0.3}" y="${hcy - ry * 0.86}" width="${ry * 0.6}" height="${ry * 0.12}" rx="3" fill="${s.trimColor}"/>`); break;
    case 'short': break;
    case 'twintails': for (const sd of [-1, 1]) backHair.unshift(`<path d="M${cx + sd * rx * 0.8} ${hcy - ry * 0.4} Q${cx + sd * rx * 1.7} ${hcy + ry * 0.2} ${cx + sd * rx * 1.3} ${hcy + ry * (0.8 + 2 * len)} Q${cx + sd * rx * 1.05} ${hcy + ry * 0.3} ${cx + sd * rx * 0.8} ${hcy - ry * 0.1} Z" fill="${hc}"/>`); break;
    case 'halfup': backHair.unshift(`<path d="M${cx - rx * 1.05} ${hcy} Q${cx - rx * 1.15} ${hcy + ry * (1 + 2 * len)} ${cx - rx * 0.6} ${hcy + ry * (1.2 + 2.2 * len)} L${cx + rx * 0.6} ${hcy + ry * (1.2 + 2.2 * len)} Q${cx + rx * 1.15} ${hcy + ry * (1 + 2 * len)} ${cx + rx * 1.05} ${hcy} Z" fill="${hc}"/>`); backHair.push(`<circle cx="${cx}" cy="${hcy - ry * 1.02}" r="${ry * 0.26}" fill="${hc}"/>`); break;
  }
  // 发梢挑染：用头发自己的形状做剪切，只给末端上色
  if (!only.hairBack && s.streak === 'tips') {
    const longStyle = ['highpony', 'lowpony', 'long', 'twintails', 'halfup'].includes(s.hairBack);
    const tipY = longStyle ? hcy + ry * (0.75 + 1.7 * len) : hcy + ry * 0.55;
    backHair.push(`<clipPath id="bh${U}">${backHair.join('').replace(/ fill="[^"]*"/g, '')}</clipPath><rect clip-path="url(#bh${U})" x="-100" y="${tipY}" width="440" height="400" fill="${s.streakColor}"/>`);
  }

  backHair.push(inkLayer('hairBack'));

  // 脸
  const facePath = (() => {
    const t = hcy - ry, b = hcy + ry, l = cx - rx, r = cx + rx;
    switch (s.faceShape) {
      case 'round': return `M${l} ${hcy} A${rx} ${ry} 0 1 0 ${r} ${hcy} A${rx} ${ry} 0 1 0 ${l} ${hcy} Z`;
      case 'square': return `M${l} ${hcy - ry * 0.2} Q${l} ${t} ${cx} ${t} Q${r} ${t} ${r} ${hcy - ry * 0.2} L${r - rx * 0.06} ${hcy + ry * 0.62} Q${r - rx * 0.12} ${b} ${cx} ${b} Q${l + rx * 0.12} ${b} ${l + rx * 0.06} ${hcy + ry * 0.62} Z`;
      case 'pointed': return `M${l} ${hcy - ry * 0.1} Q${l} ${t} ${cx} ${t} Q${r} ${t} ${r} ${hcy - ry * 0.1} Q${r - rx * 0.08} ${hcy + ry * 0.6} ${cx} ${b + ry * 0.02} Q${l + rx * 0.08} ${hcy + ry * 0.6} ${l} ${hcy - ry * 0.1} Z`;
      default: return `M${l} ${hcy - ry * 0.05} Q${l} ${t} ${cx} ${t} Q${r} ${t} ${r} ${hcy - ry * 0.05} Q${r} ${hcy + ry * 0.75} ${cx} ${b} Q${l} ${hcy + ry * 0.75} ${l} ${hcy - ry * 0.05} Z`;
    }
  })();
  headParts.unshift(`<path d="${facePath}" fill="${s.skin}"/>`);

  // 表情
  const X = typeof expr === 'string' ? exprOf(expr, D) : expr;
  let eyeStyle = s.eyes, mouthStyle = X.mouth === 'base' ? s.mouth : X.mouth, tilt = s.browTilt, browLift = 0, eyeScale = 1, eyeState = X.eye;
  if (X.brow === 'up') { browLift = 5; tilt = Math.min(1, tilt + 0.2); }
  if (X.brow === 'knit') { tilt = 1; browLift = -2; }
  if (X.brow === 'down') { tilt = -0.9; }
  if (eyeState === 'wide') eyeScale = 1.22;
  if (eyeState === 'arc') eyeStyle = 'smile';
  if (eyeState === 'star') eyeStyle = 'sparkle';
  const omit = D.omitExpr?.[X.hand] || [];
  const hideSlot = X.hand && (D.hide[X.hand] || only[X.hand]) && (hasDrawExpression(D, X.hand) || opt.forceHide);
  const hideFace = only.face || hideSlot;

  if (chan) { try { chan.postMessage(m); } catch (e) {} }

}

function botActions(n, call) {
  const acts = [];

  const me = (n.guests || []).find((g) => g.id === GUEST.id);
  if (!me) return acts;
  if (n.picking) {
    if (n.pickers && n.pickers.includes(GUEST.id) && !n.pickedBy.includes(GUEST.id) && n.pickedBy.includes('host')) {
      const id = n.offer.find((p) => !(n.pk[p] && !L.PERKS[p].stack)) || n.offer[0];
      acts.push({ type: 'perk', id, by: GUEST.id });
    }
    return acts;
  }
  if (call % 5) return acts;
  const g = L.nearestGhost(n, false);
  if (!g) return acts;
  const want = g.type === 'shade' && n.item !== 'lamp' ? 'lamp' : g.type === 'fly' ? 'bow' : 'sword';
  if (me.item !== want) acts.push({ type: 'item', item: want, by: GUEST.id });
  const c = L.ghostCenter(g);
  acts.push({ type: 'hitAt', x: c.x, y: c.y, by: GUEST.id });
  return acts;
}

function hostLoop(now) {
  if (role !== 'host' || !H) return;
  H.acc += Math.min(0.1, (now - H.last) / 1000);
  H.last = now;
  let steps = 0;
  while (H.acc >= STEP && steps < 6 && !H.n.over) {
    const actions = H.queue.splice(0);
    if (H.bot) actions.push(...botActions(H.n, H.call));
    if (actions.some((a) => a.type === 'join') && !H.joinedAt) { H.joinedAt = H.call; toast(`${GUEST.name}来帮忙了！下一波起鬼会变多`); }
    if (actions.length) H.log.push([H.call, actions]);
    L.nightStep(H.n, actions);
    H.call++; H.acc -= STEP; steps++;
  }
  view = snapshot(H.n);
  drawView(view);
  if (H.guestTab) send({ t: 'state', key: H.nightKey, s: view });
  if (H.n.over) return finishHost();
  raf = requestAnimationFrame(hostLoop);
}

function snapshot(n) {
  return {
    door: n.door, doorMax: n.doorMax, wave: n.wave, waves: L.NIGHT.waves, picking: n.picking, offer: n.offer,
    pickers: n.pickers || [], pickedBy: n.pickedBy || [], pk: n.pk, item: n.item, guests: n.guests || [],
    kills: n.kills, coins: n.coins, over: n.over, won: n.result ? n.result.won : null, bows: n.bows.length,
    ghosts: n.ghosts.map((g) => ({ id: g.id, type: g.type, x: +g.x.toFixed(1), y: +g.y.toFixed(1), ox: +g.ox.toFixed(1), k: +g.k.toFixed(3),
      hp: +g.hp.toFixed(1), max: +g.max.toFixed(1), vis: L.revealed(n, g) ? 1 : 0, name: g.name, seed: g.lookSeed })),
  };
}

// 像服务器那样：从开打那一刻起照记录重放，看结果是不是一样
function replayCheck(start, log) {
  const n = L.startNight(JSON.parse(JSON.stringify(start.house)), JSON.parse(JSON.stringify(start.person)), start.options);
  const byCall = new Map(log);
  const last = log.length ? log[log.length - 1][0] : 0;
  for (let call = 0; call <= last + 20000 && !n.over; call++) L.nightStep(n, byCall.get(call) || []);
  return n.result;
}

function finishHost() {
  clearInterval(callTimer);
  const result = H.n.result;
  const replayed = replayCheck(H.start, H.log);
  const ok = JSON.stringify(replayed) === JSON.stringify(result);
  const ops = H.log.reduce((s, [, a]) => s + a.length, 0);
  const guestIn = (H.n.guests || []).length > 0;
  const summary = { won: result.won, kills: result.kills, coins: result.coins, ok, calls: H.call, ops, guestIn, bot: H.bot };
  if (H.guestTab) send({ t: 'end', key: H.nightKey, summary });
  renderEnd(summary, 'host');
}

// ---------- 族人：等弹窗 ----------
function renderWaiting(popup) {
  role = 'waiting';
  cancelAnimationFrame(raf);
  $('app').innerHTML = `<h1>一起守夜</h1>
    <div class="card" id="waitcard"><h2>你是${GUEST.name}</h2><p class="muted" id="waittext">在自己家里忙着。族人家被砸门，这里会弹出来。</p></div>
    <div id="popup"></div>
    <button type="button" class="big" data-a="back"><b>回到开头</b></button>`;
  $('app').querySelector('[data-a=back]').onclick = renderMenu;
  if (popup) showPopup(popup);
  // 有的网页不让两个标签互相传话：等一会儿没弹，告诉玩家换个打开方式
  setTimeout(() => {
    if (role !== 'waiting' || declined || !$('waittext') || ($('popup') && $('popup').dataset.key)) return;
    $('waittext').textContent = '主人那边已经开打、这里却没弹出来？这个网页可能不让两个标签互相传话。可以用离线版（prototype/coop.html，用电脑上的浏览器打开），或者回到开头点「一个人试」。';
  }, 8000);
}
function showPopup(msg) {
  const box = $('popup');
  if (!box || box.dataset.key === msg.key) return;
  box.dataset.key = msg.key;
  box.innerHTML = `<div class="card popup" role="alertdialog" aria-labelledby="pt"><h2 id="pt">${esc(msg.house)}正在被鬼砸门！</h2>
    <p class="muted">去帮忙吗？去了就进${esc(msg.host)}的夜里，两个人一起打。你拿弓，射天上的飞鬼正好。</p>
    <div class="row"><button type="button" class="big main" data-a="go"><b>去帮忙</b></button><button type="button" class="big" data-a="no"><b>不去</b></button></div></div>`;
  box.querySelector('[data-a=go]').onclick = () => {
    send({ t: 'go', key: msg.key, name: GUEST.name, item: GUEST.item, power: GUEST.power, hp: GUEST.hp, day: GUEST.day });
    box.innerHTML = '<div class="card"><p class="muted">正在赶过去……</p></div>';
  };
  box.querySelector('[data-a=no]').onclick = () => { declined = msg.key; box.innerHTML = ''; box.dataset.key = ''; $('waittext').textContent = '这回没去。下回族人再被砸门，还会弹出来。'; };
  box.querySelector('[data-a=go]').focus({ preventScroll: true });
}

// ---------- 两边共用：守夜画面 ----------
function buildNight(me) {
  ghostEls = new Map();
  drawnPlayers = ''; pickKey = '';
  $('app').innerHTML = `<div class="hud"><span class="wave" id="nwave">第 1 波</span>
      <div class="doorbar"><span>门</span><div class="bar" id="nd-bar"><i></i></div><b id="nd-num"></b></div></div>
    <svg viewBox="0 0 360 500" class="stage" id="nsvg" role="application" aria-label="守夜：点鬼打它">${stageSvg()}</svg>
    <p class="status" id="nstatus"></p>
    <div class="items" role="group" aria-label="你手里拿什么">${ITEMS.map(([k, g, c]) => `<button type="button" class="item" data-item="${k}" aria-pressed="false"><i style="background:${c}"></i>${g}</button>`).join('')}</div>
    <p class="note" id="perkline"></p>
    <div id="pickbox"></div>`;
  const svg = $('nsvg');
  svg.addEventListener('pointerdown', (e) => {
    if (!view || view.over) return;
    e.preventDefault();
    const p = toSvg(svg, e);
    act({ type: 'hitAt', x: p.x, y: p.y });
    slash(p.x, p.y, me === 'host' ? '#FFE7A8' : '#A8E6FF');
  });
  $('app').querySelectorAll('[data-item]').forEach((b) => { b.onclick = () => act({ type: 'item', item: b.dataset.item }); });
}
// 自己点的：主人直接排进下一步；族人传给主人那边
function act(action) {
  if (role === 'host' && H && !H.n.over) H.queue.push(action);
  else if (role === 'guest') send({ t: 'act', key: guestKey, action });
}
function toSvg(svg, e) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

function stageSvg() {
  const lane = L.NIGHT.lane;
  const far = lane.farWidth, near = lane.farWidth + lane.extraWidth;
  return `<rect width="360" height="500" fill="url(#nsky)"/>
    <polygon points="${180 - far},${lane.depthStart} ${180 + far},${lane.depthStart} ${180 + near},${lane.gateY} ${180 - near},${lane.gateY}" fill="url(#lane)"/>
    <path d="M0 60 L${180 - far} ${lane.depthStart} L${180 - near} ${lane.gateY} L0 ${lane.gateY} Z" fill="#0A0F1E"/>
    <path d="M360 60 L${180 + far} ${lane.depthStart} L${180 + near} ${lane.gateY} L360 ${lane.gateY} Z" fill="#0A0F1E"/>
    <circle cx="122" cy="466" r="150" fill="url(#lampg)"/>
    <g id="bows"></g>
    <g id="glayer"></g>
    <rect x="0" y="${lane.gateY + 4}" width="360" height="${500 - lane.gateY - 4}" fill="#141B2E"/>
    <rect x="118" y="${lane.gateY - 2}" width="124" height="12" rx="3" fill="#6B4A2E" id="gate"/>
    <g id="players"></g>
    <g id="glabels"></g>
    <g id="fx"></g>`;
}

function ghostEl(g) {
  const face = lookFromSeed(g.seed);
  const el = document.createElementNS(NS, 'g');
  el.innerHTML = `<g class="gb"><ellipse cx="0" cy="-44" rx="32" ry="48" fill="url(#gglow)"/>${ghostSvg(face.look, face.expr, face.age, 0, 0, 0.2)}</g>`;
  const tag = L.GHOSTS[g.type].tag;
  const label = document.createElementNS(NS, 'g');
  label.innerHTML = `<rect x="-17" y="-3" width="34" height="6" rx="3" fill="#0B0F1E" opacity="0.85"/><rect class="hpb" x="-17" y="-3" width="34" height="6" rx="3" fill="#FF6B6B"/>
    ${tag ? `<g transform="translate(0 -15)"><circle r="10" fill="${tag[1]}" stroke="#0B0F1E" stroke-width="1.5"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1E2A2C">${tag[0]}</text></g>` : ''}`;
  $('glayer').append(el);
  $('glabels').append(label);
  return { el, gb: el.querySelector('.gb'), label, hpb: label.querySelector('.hpb'), hp: g.hp, x: g.x, y: g.y, k: g.k };
}

function floatText(x, y, text, cls) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x.toFixed(1)); t.setAttribute('y', y.toFixed(1)); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('class', 'dmg ' + (cls || '')); t.textContent = text;
  const fx = $('fx'); if (!fx) return;
  fx.append(t); setTimeout(() => t.remove(), 700);
}
function slash(x, y, color) {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1', (x - 12).toFixed(1)); l.setAttribute('y1', (y - 12).toFixed(1)); l.setAttribute('x2', (x + 12).toFixed(1)); l.setAttribute('y2', (y + 12).toFixed(1));
  l.setAttribute('stroke', color); l.setAttribute('stroke-width', '3'); l.setAttribute('stroke-linecap', 'round');
  const fx = $('fx'); if (!fx) return;
  fx.append(l); setTimeout(() => l.remove(), 120);
}

let drawnPlayers = '';
function drawPlayers(s) {
  const guest = s.guests[0];
  const key = s.item + '|' + (guest ? guest.item : '-');
  if (key === drawnPlayers) return;
  drawnPlayers = key;
  const badge = (x, item, name, mine) => `<g transform="translate(${x} 400)"><circle r="13" fill="#0B0F1E" stroke="${ITEM[item].c}" stroke-width="2.5"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="${ITEM[item].c}">${ITEM[item].g}</text>
    <text y="-19" text-anchor="middle" font-size="11" fill="#DCE8F7" paint-order="stroke" stroke="#0B0F1E" stroke-width="3">${esc(name)}${mine ? '（你）' : ''}</text></g>`;
  const meHost = role === 'host';
  $('players').innerHTML = person(HOST.look, 'angry', 'adult', 120, 498, 0.19) + badge(120, s.item, HOST.name, meHost)
    + (guest ? person(GUEST.look, 'angry', 'adult', 244, 498, 0.19) + badge(244, guest.item, GUEST.name, !meHost) : '');
}

function drawView(s) {
  if (!$('nsvg')) return;
  $('nwave').textContent = `第 ${Math.min(s.wave + 1, s.waves)} / ${s.waves} 波`;
  const p = clamp(s.door / s.doorMax, 0, 1);
  $('nd-bar').querySelector('i').style.width = (p * 100).toFixed(1) + '%';
  $('nd-bar').classList.toggle('low', p < 0.3);
  $('nd-num').textContent = `${Math.max(0, Math.ceil(s.door))} / ${s.doorMax}`;
  const seen = new Set();
  for (const g of s.ghosts) {
    seen.add(g.id);
    let r = ghostEls.get(g.id);
    if (!r) { r = ghostEl(g); ghostEls.set(g.id, r); }
    if (g.hp < r.hp - 0.5) floatText(g.x + g.ox, g.y - 70 * g.k, '-' + Math.round(r.hp - g.hp));
    r.hp = g.hp; r.x = g.x + g.ox; r.y = g.y; r.k = g.k;
    r.el.setAttribute('transform', `translate(${(g.x + g.ox).toFixed(1)} ${g.y.toFixed(1)}) scale(${g.k})`);
    r.gb.setAttribute('opacity', g.type === 'shade' ? (g.vis ? '0.9' : '0.07') : '0.95');
    r.label.setAttribute('transform', `translate(${(g.x + g.ox).toFixed(1)} ${(g.y - 96 * g.k).toFixed(1)})`);
    r.label.setAttribute('opacity', g.vis ? '1' : '0');
    r.hpb.setAttribute('width', (34 * clamp(g.hp / g.max, 0, 1)).toFixed(1));
  }
  for (const [id, r] of ghostEls) {
    if (seen.has(id)) continue;
    floatText(r.x, r.y - 40, '散了', 'good');
    r.el.remove(); r.label.remove(); ghostEls.delete(id);
  }
  $('bows').innerHTML = [40, 320, 92, 268].slice(0, s.bows).map((x) => `<g transform="translate(${x} 410)"><rect x="-12" y="-6" width="24" height="12" rx="3" fill="#5A4632"/><line x1="-14" y1="-8" x2="14" y2="-8" stroke="#C9A76A" stroke-width="2"/></g>`).join('');
  drawPlayers(s);
  const mine = role === 'host' ? s.item : (s.guests[0] || {}).item;
  $('app').querySelectorAll('[data-item]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.item === mine)));
  const guest = s.guests[0];
  $('nstatus').innerHTML = guest
    ? `<b>${role === 'host' ? GUEST.name : HOST.name}</b>拿着${ITEM[role === 'host' ? guest.item : s.item].g}，和你一起打。援兵到了，鬼多了一半`
    : role === 'host' ? (H && H.bot ? `等${GUEST.name}赶过来……` : '弹窗已经发给族人了，等人来帮忙……') : '';
  const pk = Object.entries(s.pk);
  $('perkline').textContent = pk.length ? '今晚的本事：' + pk.map(([k, n]) => L.PERKS[k].n + (n > 1 ? ` ×${n}` : '')).join('、') : '守住一波，挑一个本事。';
  drawPick(s);
}

let pickKey = '';
function drawPick(s) {
  const box = $('pickbox');
  const meId = role === 'host' ? 'host' : GUEST.id;
  const together = s.pickers.length > 0;
  const mustPick = s.picking && (!together ? role === 'host' : s.pickers.includes(meId) && !s.pickedBy.includes(meId));
  const waiting = s.picking && !mustPick;
  const key = s.picking ? `${s.wave}|${mustPick}|${s.pickedBy.join(',')}` : '';
  if (key === pickKey) return;
  pickKey = key;
  if (!s.picking) { box.innerHTML = ''; return; }
  if (waiting) {
    box.innerHTML = `<div class="pick"><div class="card"><h2>第 ${s.wave + 1} 波守住了！</h2><p class="muted">等${role === 'host' ? GUEST.name : HOST.name}挑本事……</p></div></div>`;
    return;
  }
  const taken = (id) => s.pk[id] && !L.PERKS[id].stack;
  box.innerHTML = `<div class="pick"><div class="card" role="dialog" aria-labelledby="pk-t"><h2 id="pk-t">第 ${s.wave + 1} 波守住了！挑一个本事</h2>
    <p class="note">${together ? '两个人各挑一个，挑完才开下一波。' : '本事只在今晚有用。'}</p>
    ${s.offer.map((id) => `<button type="button" class="big perk" data-perk="${id}"${taken(id) ? ' disabled' : ''}><b>${L.PERKS[id].n}</b><small>${taken(id) ? '对方挑了这个' : L.PERKS[id].d}</small></button>`).join('')}</div></div>`;
  box.querySelectorAll('[data-perk]').forEach((b) => { b.onclick = () => { act({ type: 'perk', id: b.dataset.perk }); box.innerHTML = `<div class="pick"><div class="card"><p class="muted">挑好了。</p></div></div>`; }; });
  const first = box.querySelector('[data-perk]:not([disabled])'); if (first) first.focus({ preventScroll: true });
}

// ---------- 打完 ----------
function renderEnd(sum, me) {
  role = 'end';
  cancelAnimationFrame(raf);
  const together = sum.guestIn;
  $('app').innerHTML = `<h1>${sum.won ? '守住了！' : '门破了'}</h1>
    <div class="card">
      <dl class="stat"><dt>打散的鬼</dt><dd>${sum.kills}</dd><dt>纸钱</dt><dd>${sum.won ? sum.coins + ' 文' : '没有'}</dd>
      <dt>一起打</dt><dd>${together ? `${HOST.name} + ${GUEST.name}${sum.bot ? '（电脑）' : ''}` : '没有人来'}</dd></dl>
      ${together && sum.won ? `<p class="note">两个人都拿全份纸钱：${HOST.name} ${sum.coins} 文，${GUEST.name} ${sum.coins} 文。</p>` : ''}
      <p class="verify ${sum.ok ? 'ok' : 'bad'}" id="verify">${sum.ok ? '✅' : '❌'} 服务器重放核对：${sum.ok ? '一致' : '对不上'}（${sum.calls} 步、${sum.ops} 个操作）</p>
      <p class="note">打的时候${me === 'host' ? '你这边' : `${HOST.name}那边`}一步一步算，${GUEST.name}的点击也记进了同一份记录。打完照记录从头重放一遍，结果一样，说明谁也改不了战果。</p>
    </div>
    ${me === 'host' ? '<button type="button" class="big main" data-a="again"><b>再来一夜</b></button>' : '<button type="button" class="big main" data-a="wait"><b>回家接着等</b></button>'}
    <button type="button" class="big" data-a="back"><b>回到开头</b></button>`;
  const again = $('app').querySelector('[data-a=again]'); if (again) again.onclick = () => startHost(sum.bot);
  const wait = $('app').querySelector('[data-a=wait]'); if (wait) wait.onclick = () => renderWaiting();
  $('app').querySelector('[data-a=back]').onclick = renderMenu;
}

// ---------- 收消息 ----------
let guestKey = null;
listen((m) => {
  if (!m || m.from === TAB) return;
  if (role === 'host' && H && m.key === H.nightKey) {
    if (m.t === 'go' && !H.guestTab && !H.n.over && !H.bot) {
      H.guestTab = m.from;
      H.queue.push({ type: 'join', by: GUEST.id, item: m.item, power: m.power, hp: m.hp, day: m.day });
      send({ t: 'welcome', key: H.nightKey, to: m.from });
      clearInterval(callTimer);
    } else if (m.t === 'act' && m.from === H.guestTab && m.action && ['hitAt', 'item', 'perk'].includes(m.action.type)) {
      H.queue.push({ ...m.action, by: GUEST.id });
    }
    return;
  }
  if (m.t === 'call' && role === 'waiting' && m.key !== declined) showPopup(m);
  if (m.t === 'welcome' && m.to === TAB && role === 'waiting') {
    role = 'guest'; guestKey = m.key; drawnPlayers = ''; pickKey = '';
    buildNight('guest');
    toast(`进了${HOST.house}的夜里，开打！`);
  }
  if (m.t === 'state' && role === 'guest' && m.key === guestKey) { view = m.s; drawView(view); }
  if (m.t === 'end' && role === 'guest' && m.key === guestKey) renderEnd(m.summary, 'guest');
});

renderMenu();
</script>
</body></html>
