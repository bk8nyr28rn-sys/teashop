<style>
/* 布局：左边（手机上是顶部）固定的人物预览台，右边（手机上是下面）按部位分页的捏人面板。青瓷纸色 + 墨色，朱砂只给“选中”和主要动作 */
:root {
  --bg: #E7ECE8;

  --ink: #1E2A2C;
  --muted: #5B6B68;
  --line: #CAD5D0;
  --accent: #2E7D6B;
  --seal: #B8402F;
  --on-seal: #FFF7F2;
  --stage: #DCE4DF;
  --font-display: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #11181B; --panel: #19232A; --ink: #E3EBE7; --muted: #94A6A1; --line: #2C3B40; --accent: #55B99F; --seal: #E0654F; --on-seal: #1A1010; --stage: #152025; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #11181B; --panel: #19232A; --ink: #E3EBE7; --muted: #94A6A1; --line: #2C3B40; --accent: #55B99F; --seal: #E0654F; --on-seal: #1A1010; --stage: #152025; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 880px) { .wrap { grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); align-items: start; } }

header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
header.top h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.04em; }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }

/* 预览台 */
.stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-direction: column; gap: 8px; background: var(--bg); padding-bottom: 8px; }
@media (min-width: 880px) { .stage { top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.view { position: relative; border-radius: 18px; overflow: hidden; background: var(--stage); border: 1px solid var(--line); height: clamp(230px, 42vh, 470px); }
.view svg { display: block; width: 100%; height: 100%; }
.rowbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.prefs { display: flex; flex-direction: column; gap: 8px; }
#expr { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
#expr::-webkit-scrollbar { display: none; }
#expr .chip { flex: none; }
/* 手机上：预览小一点，表情 / 年龄 / 背景合成一行左右滑，给下面的面板留出地方 */
@media (max-width: 879px) {
  .view { height: clamp(220px, 32vh, 320px); }
  .prefs { flex-direction: row; overflow-x: auto; gap: 14px; scrollbar-width: none; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
  .prefs::-webkit-scrollbar { display: none; }
  .prefs .rowbar { flex-wrap: nowrap; flex: none; }
  .chip { min-height: 32px; padding: 0 10px; }
  .act { min-height: 36px; }
  body.drawing .stage { position: static; }
}
.rowbar .lab { flex: none; white-space: nowrap; font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip { min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.act { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; }
.act.main { background: var(--seal); color: var(--on-seal); border-color: var(--seal); }

/* 面板 */
.panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin: 0 -14px; padding: 0 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; min-height: 42px; padding: 0 14px; border: 0; background: none; font-family: var(--font-display); font-size: 18px; color: var(--muted); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--seal); }
.ctrl { display: flex; flex-direction: column; gap: 7px; }
.ctrl > .name { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctrl > .name b { color: var(--ink); font-weight: 500; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }

.colors { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 34px; height: 34px; border-radius: 999px; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--seal); }
.sw.custom { background: conic-gradient(#e55, #ed5, #5d7, #5ce, #66f, #e5d, #e55); position: relative; }
.sw.custom span { position: absolute; inset: 7px; border-radius: 999px; background: var(--c); border: 2px solid var(--panel); }
.picker { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--bg); }
.picker label { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.picker input[type="range"] { -webkit-appearance: none; appearance: none; height: 14px; border-radius: 7px; background: var(--track); }
.picker input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 999px; background: #fff; border: 3px solid #1E2A2C; }
.picker input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 999px; background: #fff; border: 3px solid #1E2A2C; }
.grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.sub { font-family: var(--font-display); font-size: 17px; margin: 4px 0 -4px; }
.code { display: grid; gap: 8px; }
.code textarea { width: 100%; min-height: 68px; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }
.note { font-size: 12px; color: var(--muted); }
.drawbox { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .drawbox { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; } }
.pad { width: 100%; max-width: 340px; aspect-ratio: 1; border-radius: 14px; border: 2px dashed var(--line); background: var(--stage); touch-action: none; cursor: crosshair; display: block; }
.drawtools { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.toast { min-height: 18px; font-size: 12.5px; color: var(--accent); }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.idle { animation: idle 2.2s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-4px); } }
.persona { display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.persona b { font-family: var(--font-display); font-size: 24px; font-weight: 400; }
.persona span { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>武林捏人台</h1>

    <div id="pane"></div>
  </section>
</div>

}

function exprOf(id) {

// 笔画转成 SVG

let S = loadState() || { ...DEFAULT, draw: emptyDraw() };

// 手绘：每层是一串笔画 { c 颜色, w 粗细, p 点 [[x, y], ...] }。脸上的层以头的中心为原点、以头的半高为 1；花纹和图案以 0–1 的方块为准
const DRAW_LAYERS = [['face', '脸上（一直显示）'], ['h1', '手绘表情 1'], ['h2', '手绘表情 2'], ['h3', '手绘表情 3'], ['h4', '手绘表情 4'], ['cloth', '衣服花纹'], ['emblem', '胸前图案']];

function loadState() {

// ---------------- 画人（画板 240 × 400，脚底 y = 392） ----------------
function headGeom(s) { const h = 372 / (3 + s.heads); return { cx: 120, hcy: 20 + h / 2, ry: h / 2 }; }
const INK = '#2B2233';
const lerp = (a, b, t) => a + (b - a) * t;

function drawPerson(s0, expr, age, opt = {}) {

    case 'long': backHair.unshift(`<path d="M${cx - rx * 1.05} ${hcy} Q${cx - rx * 1.2} ${hcy + ry * (1 + 2.4 * len)} ${cx - rx * 0.7} ${hcy + ry * (1.3 + 2.6 * len)} L${cx + rx * 0.7} ${hcy + ry * (1.3 + 2.6 * len)} Q${cx + rx * 1.2} ${hcy + ry * (1 + 2.4 * len)} ${cx + rx * 1.05} ${hcy} Z" fill="${hc}"/>`); break;
    case 'buns': backHair.push(`<circle cx="${cx - rx * 0.78}" cy="${hcy - ry * 0.82}" r="${ry * 0.38}" fill="${hc}"/><circle cx="${cx + rx * 0.78}" cy="${hcy - ry * 0.82}" r="${ry * 0.38}" fill="${hc}"/>`); headParts.push(`<path d="M${cx - rx * 0.98} ${hcy - ry * 0.62} q${rx * 0.2} ${ry * 0.12} ${rx * 0.4} 0 M${cx + rx * 0.58} ${hcy - ry * 0.62} q${rx * 0.2} ${ry * 0.12} ${rx * 0.4} 0" stroke="${s.trimColor}" stroke-width="3" fill="none"/>`); break;
    case 'topknot': backHair.push(`<circle cx="${cx}" cy="${hcy - ry * 1.08}" r="${ry * 0.34}" fill="${hc}"/>`); headParts.push(`<rect x="${cx - ry * 0.3}" y="${hcy - ry * 0.86}" width="${ry * 0.6}" height="${ry * 0.12}" rx="3" fill="${s.trimColor}"/>`); break;
    case 'short': break;

    case 'halfup': backHair.unshift(`<path d="M${cx - rx * 1.05} ${hcy} Q${cx - rx * 1.15} ${hcy + ry * (1 + 2 * len)} ${cx - rx * 0.6} ${hcy + ry * (1.2 + 2.2 * len)} L${cx + rx * 0.6} ${hcy + ry * (1.2 + 2.2 * len)} Q${cx + rx * 1.15} ${hcy + ry * (1 + 2 * len)} ${cx + rx * 1.05} ${hcy} Z" fill="${hc}"/>`); backHair.push(`<circle cx="${cx}" cy="${hcy - ry * 1.02}" r="${ry * 0.26}" fill="${hc}"/>`); break;

function chipRow(id, items, key) {
  const row = $(id);
  row.querySelectorAll('.chip').forEach((c) => c.remove());
  for (const [v, n] of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = n; b.setAttribute('aria-pressed', String(view[key] === v));
    b.addEventListener('click', () => { view[key] = v; chipRow(id, items, key); renderView(); });
    row.appendChild(b);
  }
}
function renderTabs() {
  const tabs = $('tabs'); tabs.innerHTML = '';

    b.type = 'button'; b.className = 'tab'; b.role = 'tab'; b.id = 'tab-' + id; b.textContent = name; b.setAttribute('aria-selected', String(view.tab === id));
    b.addEventListener('click', () => { view.tab = id; view.picker = null; renderTabs(); renderPane(); renderView(); try { localStorage.setItem('wulin-tab', id); } catch (e) {} });

}
function fmtPct(v, min = 0, max = 1) { return Math.round(((v - min) / (max - min)) * 100) + '%'; }

function speak(text) {

      const u = new SpeechSynthesisUtterance(text);

function babble(text, pitch, rate) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const step = 0.11 / rate;
    let t = audioCtx.currentTime + 0.02;
    for (const ch of text) {
      if (/[，。！？、—\s]/.test(ch)) { t += step * 1.4; continue; }
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const code = ch.codePointAt(0) || 0;
      o.type = 'triangle';
      o.frequency.value = 180 * pitch * (1 + (code % 7) * 0.05);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + step * 0.9);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + step);
      t += step;
    }
  } catch (e) { const n = $('voice-note'); if (n) n.textContent = '这台设备放不了声音。'; }
}

function padBox() {
  const L = drawUI.layer;
  if (L === 'cloth' || L === 'emblem') return { vb: '-0.05 -0.05 1.1 1.1', toLocal: (x, y) => [x, y] };

  return { vb: `${g.cx - g.ry * 1.45} ${g.hcy - g.ry * 1.5} ${g.ry * 2.9} ${g.ry * 2.9}`, toLocal: (x, y) => [(x - g.cx) / g.ry, (y - g.hcy) / g.ry], g };

function renderPad() {

function bindDraw() {
  for (const [k] of DRAW_LAYERS) $(`dl-${k}`).addEventListener('click', () => { drawUI.layer = k; drawUI.history = []; renderPane(); });
  bindCtrl({ t: 'color', k: 'brushColor', n: '画笔颜色', p: 'brush' });
  $('r-brushSize').addEventListener('input', (e) => { S.brushSize = Number(e.target.value); $('v-brushSize').textContent = Math.round(S.brushSize * 100); saveState(); });
  if ($('r-tileSize')) $('r-tileSize').addEventListener('input', (e) => { S.tileSize = Number(e.target.value); $('v-tileSize').textContent = fmtPct(S.tileSize); saveState(); renderView(); });
  if ($('d-hide')) $('d-hide').addEventListener('click', () => { S.draw.hide[drawUI.layer] = !S.draw.hide[drawUI.layer]; saveState(); renderPane(); renderView(); });
  $('d-erase').addEventListener('click', () => { drawUI.erase = !drawUI.erase; renderPane(); });
  $('d-undo').addEventListener('click', () => { const prev = drawUI.history.pop(); if (prev) { S.draw[drawUI.layer] = prev; afterDraw(); } });
  $('d-clear').addEventListener('click', () => { if (!S.draw[drawUI.layer].length) return; drawUI.history.push(S.draw[drawUI.layer]); S.draw[drawUI.layer] = []; afterDraw(); });
  renderPad();
  const pad = $('pad');
  let cur = null;
  const local = (ev) => {
    const pt = pad.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const q = pt.matrixTransform(pad.getScreenCTM().inverse());
    const [u, v] = padBox().toLocal(q.x, q.y);
    return [Math.round(u * 1000) / 1000, Math.round(v * 1000) / 1000];
  };
  const eraseAt = (p) => {
    const list = S.draw[drawUI.layer];
    const keep = list.filter((st) => !st.p.some((q) => Math.hypot(q[0] - p[0], q[1] - p[1]) < st.w / 2 + 0.04));
    if (keep.length !== list.length) { drawUI.history.push(list); S.draw[drawUI.layer] = keep; $('pad-strokes').innerHTML = strokesSvg(keep); }
  };
  pad.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    pad.setPointerCapture(ev.pointerId);
    const p = local(ev);
    if (drawUI.erase) { cur = { erase: true }; eraseAt(p); return; }
    cur = { c: S.brushColor, w: S.brushSize, p: [p] };
    const live = $('pad-live'); live.setAttribute('stroke', cur.c); live.setAttribute('stroke-width', cur.w); live.setAttribute('d', `M${p[0]} ${p[1]} l0.0001 0`);
  });

    $('pad-live').setAttribute('d', 'M' + cur.p.map((q) => `${q[0]} ${q[1]}`).join(' L'));
  });
  const end = () => {
    if (!cur) return;
    if (!cur.erase) { drawUI.history.push(S.draw[drawUI.layer]); S.draw[drawUI.layer] = [...S.draw[drawUI.layer], cur]; }
    cur = null;
    afterDraw();
  };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
}

    <div class="opts"><button type="button" class="act main" id="copy">复制捏人码</button></div>
    <label class="note" for="code-in">粘贴别人的捏人码：</label><textarea id="code-in" placeholder="WULIN1:..."></textarea>
    <div class="opts"><button type="button" class="act" id="load">载入</button></div><div class="toast" id="msg" role="status"></div></div>`;
}
function bindShare() {
  INSPIRE.forEach(([, o], i) => $(`ins-${i}`).addEventListener('click', () => { S = { ...DEFAULT, ...o, draw: S.draw }; saveState(); renderView(); renderPane(); }));
  $('copy').addEventListener('click', () => {
    const t = $('code-out');
    navigator.clipboard?.writeText(t.value).then(() => { $('msg').textContent = '已复制'; }, () => { t.select(); $('msg').textContent = '已选中，长按或 Ctrl+C 复制'; });
  });
  $('load').addEventListener('click', () => {
    try { const o = decode($('code-in').value); S = { ...DEFAULT, ...o, draw: normDraw(o.draw) }; saveState(); refreshExprChips(); renderView(); $('msg').textContent = '已载入'; $('code-out').value = encode(S); }
    catch (e) { $('msg').textContent = '这串码读不出来：请确认整串都复制了，开头是 WULIN1:'; }
  });
}

// ---------------- 随机 ----------------
function randomize() {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const hue = Math.floor(Math.random() * 360);
  const scheme = (dh, s, l) => hsl2hex((hue + dh + 360) % 360, s, l);
  const n = { ...DEFAULT };
  for (const k of Object.keys(OPT)) n[k] = pick(OPT[k])[0];
  for (const k of ['heads', 'build', 'height', 'faceWidth', 'eyeSize', 'eyeGap', 'eyeY', 'browThick', 'mouthY', 'hairLen']) n[k] = Math.round((0.15 + Math.random() * 0.7) * 100) / 100;
  n.browTilt = Math.round((Math.random() * 1.2 - 0.4) * 100) / 100;
  n.blush = Math.round(Math.random() * 80) / 100;
  n.skin = pick(PRESETS.skin); n.hairColor = Math.random() < 0.7 ? pick(PRESETS.hair) : scheme(180, 45, 40);
  n.eyeColor = pick(PRESETS.eye);
  n.topColor = scheme(0, 45, 45); n.trimColor = scheme(180, 60, 62); n.bottomColor = scheme(20, 25, 25); n.capeColor = scheme(-30, 50, 45);
  n.patternColor = scheme(0, 30, 80); n.beltColor = scheme(0, 20, 20); n.headColor = scheme(150, 60, 55); n.neckColor = scheme(120, 40, 50);
  n.streakColor = scheme(200, 60, 55); n.markColor = pick(PRESETS.accent); n.shoeColor = scheme(30, 25, 22);
  if (Math.random() < 0.7) n.beard = 'none';
  if (Math.random() < 0.6) n.mark = 'none';
  if (Math.random() < 0.6) n.streak = 'none';
  if (Math.random() < 0.6) n.cape = 'none';
  n.browFollow = true;
  // 五官细调：在中间附近小范围随机，免得随机出太离谱的脸
  const near = (v, d) => Math.round(Math.max(0, Math.min(1, v + (Math.random() * 2 - 1) * d)) * 100) / 100;
  n.eyeRot = Math.round((Math.random() * 0.8 - 0.4) * 100) / 100;
  for (const k of ['eyeSquash', 'browY', 'browGap', 'browSize', 'noseY', 'noseSize', 'mouthSize', 'mouthSquash']) n[k] = near(0.5, 0.3);
  if (Math.random() < 0.75) n.glasses = 'none';
  n.mole = Math.random() < 0.25; n.moleX = Math.round((Math.random() * 1.4 - 0.7) * 100) / 100; n.moleY = Math.round((Math.random() * 0.8) * 100) / 100;
  for (const k of ['pMove', 'pTalk', 'pExpr', 'pAttitude', 'pQuirk']) n[k] = Math.floor(Math.random() * 8);
  n.vPitch = near(0.5, 0.4); n.vRate = near(0.5, 0.3);
  n.draw = S.draw; n.brushColor = S.brushColor; n.brushSize = S.brushSize; n.tileSize = S.tileSize;
  if (n.pattern === 'custom' && !S.draw.cloth.length) n.pattern = 'cloud';
  S = n; saveState(); renderView(); renderPane();
}

// 部件计数（给人一个“有多少可能”的直观感觉）
function countParts() {
  const choices = Object.values(OPT).reduce((a, o) => a + o.length, 0);
  const sliders = TABS.flatMap((t) => t[2]).filter((c) => c.t === 'slider').length;
  const colors = TABS.flatMap((t) => t[2]).filter((c) => c.t === 'color').length;
  $('count').textContent = `${choices} 个部件选项 · ${sliders} 个滑块 · ${colors} 处颜色随便调`;
}

// ---------------- 启动 ----------------
try { const t = localStorage.getItem('wulin-tab'); if (t && TABS.some((x) => x[0] === t)) view.tab = t; } catch (e) {}
refreshExprChips();
chipRow('age', [['child', '童年'], ['adult', '成年'], ['elder', '老年']], 'age');
chipRow('bg', [['day', '院子白天'], ['night', '守夜'], ['plain', '纯色']], 'bg');
$('random').addEventListener('click', randomize);
$('reset').addEventListener('click', () => { S = { ...DEFAULT, draw: S.draw }; saveState(); renderView(); renderPane(); });
renderTabs(); renderPane(); renderView(); countParts();
</script>
