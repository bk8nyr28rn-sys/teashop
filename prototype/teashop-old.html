/* 布局：竖屏一栏。顶栏（资源）＋ 可滚动的中间（场景在上、卡片在下）＋ 底部四个导航。单一夜色主题。 */
:root {
  --bg: #1E2048;      /* 夜色，页面底 */
  --panel: #2A2D5E;   /* 卡片 */
  --deep: #15173A;    /* 更深一层：导航、内嵌卡片 */
  --line: #4A4F8F;
  --line-2: #353A75;
  --text: #FFFFFF;
  --muted: #B9BCE8;
  --ink: #1E2048;     /* 亮色底上的字 */
  --red: #F0525A;     /* 红线 */
  --red-btn: #D63C48; /* 红色按钮底（白字够对比） */
  --gold: #FFC24B;    /* 奖励、等级 */
  --jade: #52D6A6;    /* 好事、安全 */
  --ember: #FF9A6B;   /* 坏事、怨丝 */
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--deep); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ic { width: 22px; height: 22px; flex: none; }

#app { position: relative; height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
/* 游戏界面不让选字：点按钮时不会出现蓝色选中，也不会被浏览器当成选字吃掉这一下。输入框照常可选 */
#app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#app input { -webkit-user-select: text; user-select: text; }
button, .tap { touch-action: manipulation; }

/* 顶栏 */
#hud { flex: none; padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.hud-row { display: flex; align-items: center; gap: 10px; }
.me-btn { width: 44px; height: 44px; flex: none; padding: 0; border: 2px solid var(--gold); border-radius: 14px; background: var(--line-2); overflow: hidden; }
.portrait { display: block; width: 100%; height: 100%; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.who b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-btn { flex: none; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.chip-btn .ic { width: 14px; height: 14px; }
.icon-btn { flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: var(--panel); display: grid; place-items: center; }
.res-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.res { min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 12px; padding: 4px 8px 5px; line-height: 1.2; }
.res .ic { width: 14px; height: 14px; }
.res span { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.res b { font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.res.warn b { color: var(--ember); }
.res.bump { animation: bump 0.5s; }
@keyframes bump { 30% { transform: scale(1.16); background: var(--line); } }

/* 中间：场景 + 卡片 */
#main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
#stage { position: relative; flex: none; }
.scene-svg { display: block; width: 100%; height: auto; }
.scene-svg text { font-family: var(--font-body); }
.scene-svg .display { font-family: var(--font-display); }
#fx { position: absolute; inset: 0; pointer-events: none; }
.tap { cursor: pointer; }

.bob { animation: bob 2.6s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes bob { 50% { transform: translateY(-3px); } }
.float { animation: float 3.2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes float { 50% { transform: translateY(-7px); } }
.ward { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; animation-delay: var(--sync, 0s); }
@keyframes spin { to { transform: rotate(360deg); } }
.glow, .twinkle { animation: glow 2.6s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes glow { 50% { opacity: 0.65; } }
.drift { animation: drift 40s ease-in-out infinite alternate; animation-delay: var(--sync, 0s); }
@keyframes drift { to { transform: translateX(26px); } }
.red-thread { animation: pulse 2.2s ease-in-out infinite; animation-delay: var(--sync, 0s); }
@keyframes pulse { 50% { stroke-width: 4.5; } }
.flash { animation: bolt 2.8s linear infinite; animation-delay: var(--sync, 0s); }
@keyframes bolt { 0%, 84%, 100% { opacity: 0.25; } 88%, 94% { opacity: 1; } 91% { opacity: 0.4; } }

/* 一次性的砸门特效 */
.fx-badge { transform-box: fill-box; transform-origin: center; animation: badge 2.6s 1.15s both; }
@keyframes badge { 0% { opacity: 0; transform: scale(0.3); } 12% { opacity: 1; transform: scale(1.3); } 22% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.fx-burst { opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 0.9s 1.1s both; }
@keyframes burst { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 0.95; transform: scale(1.1) rotate(18deg); } 100% { opacity: 0; transform: scale(1.5) rotate(40deg); } }
.fx-flash { opacity: 0; animation: screenflash 0.7s 1.5s both; }
@keyframes screenflash { 0%, 100% { opacity: 0; } 25% { opacity: 0.55; } }
.fx-now { animation-delay: 0s; }
/* 家族大院地图：院外游荡的鬼（循环）。鬼画在原点，靠 translate 走位 */
.roam { animation: 18s linear infinite; animation-delay: var(--sync, 0s); }
.roam-top { animation-name: roam-top; }
@keyframes roam-top { 0%, 100% { transform: translate(70px, 108px); } 50% { transform: translate(250px, 100px); } }
.roam-left { animation-name: roam-left; animation-duration: 22s; }
@keyframes roam-left { 0%, 100% { transform: translate(12px, 140px); } 50% { transform: translate(10px, 400px); } }
.roam-right { animation-name: roam-right; animation-duration: 20s; }
@keyframes roam-right { 0%, 100% { transform: translate(378px, 390px); } 50% { transform: translate(380px, 140px); } }
.roam-bottom { animation-name: roam-bottom; animation-duration: 24s; }
@keyframes roam-bottom { 0%, 100% { transform: translate(60px, 424px); } 50% { transform: translate(330px, 424px); } }
.roam-top2 { animation-name: roam-top2; animation-duration: 26s; }
@keyframes roam-top2 { 0%, 100% { transform: translate(240px, 106px); } 50% { transform: translate(40px, 112px); } }
.roam-yard { animation-name: roam-yard; animation-duration: 16s; }
@keyframes roam-yard { 0%, 100% { transform: translate(110px, 340px); } 25% { transform: translate(195px, 300px); } 50% { transform: translate(280px, 340px); } 75% { transform: translate(195px, 380px); } }
.ward-flow { animation: ward-flow 3s linear infinite; animation-delay: var(--sync, 0s); }
@keyframes ward-flow { to { stroke-dashoffset: -32; } }
.drift-up { animation: drift-up 2.4s ease-out infinite; animation-delay: var(--sync, 0s); }
@keyframes drift-up { from { transform: translateY(8px); opacity: 0; } 40% { opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }

/* 砸门：从院门飞到门口（0–1.5 秒）→ 砸三下（1.5–2.5 秒）→ 出结果（2.5 秒起） */
.raid { animation: 4.8s ease-in-out both; }
.raid-left { animation-name: raid-left; }
@keyframes raid-left { 0% { transform: translate(8px, 256px); opacity: 0; } 6% { opacity: 1; } 16% { transform: translate(90px, 280px); } 31%, 100% { transform: translate(195px, 214px); opacity: 1; } }
.raid-right { animation-name: raid-right; }
@keyframes raid-right { 0% { transform: translate(382px, 256px); opacity: 0; } 6% { opacity: 1; } 16% { transform: translate(300px, 280px); } 31%, 100% { transform: translate(195px, 214px); opacity: 1; } }
.raid-bottom { animation-name: raid-bottom; }
@keyframes raid-bottom { 0% { transform: translate(195px, 436px); opacity: 0; } 6% { opacity: 1; } 16% { transform: translate(214px, 330px); } 31%, 100% { transform: translate(195px, 214px); opacity: 1; } }
.m-bang { animation: m-bang 4.8s both; }
@keyframes m-bang { 0%, 31% { transform: none; } 35% { transform: translateY(-10px) scale(1.12); } 38% { transform: none; } 42% { transform: translateY(-10px) scale(1.12); } 45% { transform: none; } 49% { transform: translateY(-12px) scale(1.18); } 52%, 100% { transform: none; } }
.m-out { transform-box: fill-box; transform-origin: center; }
.m-defended, .m-guarded { animation: poof 0.5s 2.5s ease-in both; }
@keyframes poof { to { transform: scale(1.7); opacity: 0; } }
.m-breach { animation: m-dive 0.6s 2.5s ease-in both; }
@keyframes m-dive { to { transform: translateY(14px) scale(0.5); opacity: 0; } }
.m-purified { animation: soothe 1s 2.5s both; }
@keyframes soothe { to { transform: translate(42px, -8px) scale(0.5); opacity: 0.85; } }
.m-ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: m-ring 0.5s 1.68s ease-out both; }
.m-ring2 { animation-delay: 2.02s; } .m-ring3 { animation-delay: 2.36s; }
@keyframes m-ring { 0% { opacity: 0.9; transform: scale(0.4); } 100% { opacity: 0; transform: scale(1.8); } }
.m-knock { opacity: 0; animation: knock 1.1s 1.5s both; }
@keyframes knock { 0% { opacity: 0; transform: translateY(6px); } 15%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.m-burst { opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 0.9s 2.45s both; }
@keyframes burst { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 0.95; transform: scale(1.1) rotate(18deg); } 100% { opacity: 0; transform: scale(1.5) rotate(40deg); } }
.m-crack { opacity: 0; animation: m-crack 2.2s 2.55s both; }
@keyframes m-crack { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }
.m-flash { opacity: 0; animation: screenflash 0.7s 2.6s both; }
.m-badge { transform-box: fill-box; transform-origin: center; animation: badge 2.2s 2.55s both; }
.m-hint { opacity: 0; animation: m-hint 2.4s 0.4s both; }
@keyframes m-hint { 0% { opacity: 0; } 15%, 85% { opacity: 0.9; } 100% { opacity: 0; } }
